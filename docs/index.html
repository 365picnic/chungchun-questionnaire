<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>청춘한의원 사전문진</title>
<style>
:root {
  --brand-1: #2f3b8f;
  --brand-2: #6d4fc9;
  --brand-soft: #eef0fb;
  --ink-900: #1e2233;
  --ink-700: #454b5f;
  --ink-500: #757c92;
  --ink-300: #aeb3c4;
  --line: #e4e6f0;
  --bg: #f4f5fa;
  --surface: #ffffff;
  --c-teal: #0d9488;
  --c-orange: #ea580c;
  --shadow-sm: 0 1px 3px rgba(24, 28, 56, 0.05);
  --shadow-md: 0 10px 28px rgba(28, 32, 64, 0.08);
  --shadow-lg: 0 18px 44px rgba(28, 32, 64, 0.14);
  --radius-lg: 18px;
  --radius-md: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; background: var(--bg); color: var(--ink-900); min-height: 100vh; -webkit-font-smoothing: antialiased; }
.container { max-width: 600px; margin: 0 auto; min-height: 100vh; padding: 24px; }
.header { text-align: center; padding: 26px 0 10px; }
.header .logo-img { height: 40px; width: auto; margin-bottom: 10px; }
.header .sub { color: var(--ink-500); font-size: 13px; }

.pick-card { display: block; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 26px 24px; margin-top: 18px; box-shadow: var(--shadow-sm); transition: box-shadow .15s, transform .1s; }
.pick-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.pick-card.diet { border-top: 5px solid var(--c-orange); }
.pick-card.herbal { border-top: 5px solid var(--brand-1); }
.pick-card .emoji { font-size: 34px; margin-bottom: 10px; }
.pick-card h2 { font-size: 19px; font-weight: 800; color: var(--ink-900); margin-bottom: 6px; letter-spacing: -0.01em; }
.pick-card p { font-size: 13px; color: var(--ink-500); line-height: 1.6; margin-bottom: 14px; }
.pick-card .go-btn { display: inline-block; padding: 11px 20px; border-radius: var(--radius-md); font-size: 13.5px; font-weight: 700; color: #fff; }
.pick-card.diet .go-btn { background: linear-gradient(135deg, var(--c-orange), #f59e0b); }
.pick-card.herbal .go-btn { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img class="logo-img" src="assets/청춘한의원_로고-01.png" alt="청춘한의원">
        <div class="sub">사전문진시스템 - 받으실 문진을 선택해주세요</div>
    </div>

    <a class="pick-card diet" href="diet.html">
        <div class="emoji">🥗</div>
        <h2>다이어트 문진</h2>
        <p>다이어트 상담 및 처방을 위한 문진입니다. 몸무게/감량목표, 식습관, 생활 체크리스트 등을 입력합니다.</p>
        <span class="go-btn">다이어트 문진 시작하기 →</span>
    </a>

    <a class="pick-card herbal" href="herbal.html">
        <div class="emoji">🌿</div>
        <h2>한약 문진</h2>
        <p>일반 한약 처방을 위한 사전문진입니다. 수면, 소화, 체온, 감정 등 전반적인 몸 상태를 입력합니다.</p>
        <span class="go-btn">한약 문진 시작하기 →</span>
    </a>
</div>
</body>
</html>
