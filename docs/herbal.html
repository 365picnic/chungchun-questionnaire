<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>청춘한의원 사전문진</title>
<style>
:root {
  --brand-1: #2f3b8f;
  --brand-2: #6d4fc9;
  --brand-soft: #eef0fb;
  --ink-900: #1e2233;
  --ink-700: #454b5f;
  --ink-500: #757c92;
  --ink-300: #aeb3c4;
  --line: #e4e6f0;
  --line-soft: #eef0f7;
  --bg: #f4f5fa;
  --surface: #ffffff;
  --danger: #d64559;
  --danger-soft: #fdeef0;
  --success: #1f9d63;
  --shadow-sm: 0 1px 3px rgba(24, 28, 56, 0.05);
  --shadow-md: 0 10px 28px rgba(28, 32, 64, 0.08);
  --shadow-lg: 0 18px 44px rgba(28, 32, 64, 0.14);
  --radius-lg: 18px;
  --radius-md: 14px;
  --radius-sm: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; background: var(--bg); color: var(--ink-900); min-height: 100vh; -webkit-font-smoothing: antialiased; }
.container { max-width: 600px; margin: 0 auto; background: var(--surface); min-height: 100vh; padding: 24px; border-radius: 0; box-shadow: var(--shadow-lg); }
.header { text-align: center; padding: 20px 0; margin-bottom: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.header h1 { color: var(--ink-900); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 4px; }
.header .sub { color: var(--ink-500); font-size: 12.5px; margin-top: 6px; }
.header .logo-img { height: 36px; width: auto; }
.header .logo-img.sm { height: 26px; }
.progress-bar { width: 100%; height: 6px; background: var(--line-soft); border-radius: 4px; margin-bottom: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--brand-1), var(--brand-2)); border-radius: 4px; transition: width 0.4s ease; }
.progress-text { text-align: right; font-size: 11.5px; color: var(--ink-300); margin-bottom: 18px; }
.step-info { font-size: 13.5px; color: var(--ink-500); margin-bottom: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.step-info .cat { background: var(--brand-soft); color: var(--brand-1); padding: 4px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 700; }
.step-info .num { color: var(--ink-300); font-size: 12.5px; }

.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-weight: 700; font-size: 13.5px; margin-bottom: 8px; color: var(--ink-700); }
.form-group input { width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: var(--radius-md); font-size: 16px; background: var(--surface); transition: border-color 0.2s, box-shadow 0.2s; }
.form-group input:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(109,79,201,0.12); }
.birth-row { display: flex; gap: 8px; }
.birth-row select { flex: 1; min-width: 0; padding: 13px 6px; border: 1.5px solid var(--line); border-radius: var(--radius-md); font-size: 15px; background: var(--surface); color: var(--ink-900); }
.birth-row select:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(109,79,201,0.12); }
.gender-btns { display: flex; gap: 10px; }
.gender-btn { flex: 1; padding: 13px; text-align: center; border: 1.5px solid var(--line); border-radius: var(--radius-md); font-size: 15px; cursor: pointer; transition: all 0.2s; font-weight: 600; color: var(--ink-700); }
.gender-btn:hover { border-color: var(--brand-2); background: var(--brand-soft); }
.gender-btn.selected { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #fff; border-color: transparent; box-shadow: var(--shadow-md); }
.consent-row { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: var(--radius-md); margin-bottom: 10px; }
.consent-row input[type="checkbox"] { width: 19px; height: 19px; accent-color: var(--brand-2); }
.consent-row label { font-size: 13.5px; flex: 1; color: var(--ink-700); }

.question-title { font-size: 19px; font-weight: 700; margin-bottom: 20px; line-height: 1.5; color: var(--ink-900); letter-spacing: -0.01em; }

.opt { padding: 14px 18px; border: 1.5px solid var(--line); border-radius: var(--radius-md); font-size: 14.5px; text-align: left; cursor: pointer; transition: all 0.15s; background: var(--surface); line-height: 1.5; margin-bottom: 9px; color: var(--ink-700); }
.opt:hover { border-color: var(--brand-2); background: var(--brand-soft); }
.opt.sel { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #fff; border-color: transparent; box-shadow: var(--shadow-md); font-weight: 600; }

.sub-hdr { background: var(--ink-900); color: #fff; padding: 11px 18px; font-size: 13.5px; font-weight: 600; margin: 4px 0 10px 18px; border-radius: var(--radius-sm); }

.sub-opt { padding: 12px 16px; border: 1.5px solid var(--line-soft); border-radius: var(--radius-sm); font-size: 13.5px; text-align: left; cursor: pointer; background: #fbfbfd; line-height: 1.4; margin-bottom: 8px; margin-left: 18px; transition: all 0.15s; color: var(--ink-700); }
.sub-opt:hover { border-color: var(--brand-2); background: var(--brand-soft); }
.sub-opt.sel { background: var(--brand-2); color: #fff; border-color: transparent; box-shadow: var(--shadow-sm); font-weight: 600; }

.sub-chk { padding: 12px 16px; border: 1.5px solid var(--line-soft); border-radius: var(--radius-sm); font-size: 13.5px; cursor: pointer; background: #fbfbfd; line-height: 1.4; margin-bottom: 8px; margin-left: 18px; display: flex; align-items: center; gap: 10px; transition: all 0.15s; color: var(--ink-700); }
.sub-chk:hover { border-color: var(--brand-2); background: var(--brand-soft); }
.sub-chk.sel { background: var(--brand-soft); border-color: var(--brand-2); color: var(--ink-900); font-weight: 600; }
.sub-chk .chkbox { width: 20px; height: 20px; border: 1.5px solid var(--ink-300); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; background: #fff; }
.sub-chk.sel .chkbox { background: var(--brand-2); border-color: var(--brand-2); }
.sub-chk.sel .chkbox::after { content: '\2713'; color: #fff; font-size: 12px; font-weight: 700; }

.sub-block { margin-bottom: 12px; }

.nav-btns { display: flex; gap: 12px; margin-top: 26px; padding-bottom: 24px; }
.nav-btn { flex: 1; padding: 15px; text-align: center; font-size: 15px; font-weight: 700; cursor: pointer; border: none; border-radius: var(--radius-md); transition: all 0.15s; }
.nav-btn.prev { background: var(--line-soft); color: var(--ink-500); }
.nav-btn.prev:hover { background: var(--line); }
.nav-btn.next { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #fff; box-shadow: var(--shadow-md); }
.nav-btn.next:hover { box-shadow: var(--shadow-lg); }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

.complete-page { text-align: center; padding: 60px 20px; }
.complete-page .icon { font-size: 58px; margin-bottom: 20px; color: var(--success); }
.complete-page h2 { font-size: 21px; margin-bottom: 12px; color: var(--ink-900); font-weight: 700; }
.complete-page p { color: var(--ink-500); font-size: 14.5px; line-height: 1.7; }
.complete-page.error .icon { color: var(--danger); }

.start-screen { text-align: center; padding: 40px 20px; }
.start-screen h2 { font-size: 24px; color: var(--ink-900); margin-bottom: 16px; font-weight: 700; letter-spacing: -0.01em; }
.start-screen p { color: var(--ink-500); font-size: 13.5px; line-height: 1.6; margin-bottom: 8px; }
.start-screen .warn { color: var(--danger); font-size: 12.5px; margin-top: 16px; font-weight: 600; background: var(--danger-soft); padding: 10px 16px; border-radius: var(--radius-sm); border: 1px solid rgba(214,69,89,0.18); }
.start-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #fff; border: none; border-radius: var(--radius-md); font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 30px; box-shadow: var(--shadow-md); transition: all 0.15s; }
.start-btn:hover { box-shadow: var(--shadow-lg); }
.start-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Emotion card style */
.emo-card { background: var(--bg); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 12px; }
.emo-card-inner { display: flex; min-height: 124px; }
.emo-icon { width: 118px; min-height: 124px; display: flex; align-items: center; justify-content: center; font-size: 52px; flex-shrink: 0; }
.emo-checks { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 14px 18px; gap: 10px; }
.emo-chk { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13.5px; line-height: 1.4; padding: 5px 0; color: var(--ink-700); }
.emo-chk .ebox { width: 20px; height: 20px; border: 1.5px solid var(--ink-300); border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; background: #fff; }
.emo-chk.sel .ebox { background: var(--brand-2); border-color: var(--brand-2); }
.emo-chk.sel .ebox::after { content: '\2713'; color: #fff; font-size: 12px; font-weight: 700; }
.emo-hint { color: var(--danger); font-size: 11.5px; margin-top: 8px; font-weight: 600; }

/* Symptom entry */
.symptom-entry { background: var(--bg); border-radius: var(--radius-md); padding: 18px; margin-bottom: 12px; }
.symptom-entry .se-label { font-weight: 700; font-size: 13.5px; margin-bottom: 6px; color: var(--ink-700); }
.symptom-entry textarea { width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); font-size: 14.5px; resize: vertical; min-height: 60px; font-family: inherit; background: var(--surface); }
.symptom-entry textarea:focus { outline: none; border-color: var(--brand-2); }
.add-symptom-btn { width: 100%; padding: 12px; border: 1.5px dashed var(--ink-300); border-radius: var(--radius-md); background: var(--surface); font-size: 14px; color: var(--ink-500); cursor: pointer; margin-bottom: 12px; transition: all 0.15s; font-weight: 600; }
.add-symptom-btn:hover { border-color: var(--brand-2); color: var(--brand-2); }
.remove-symptom { background: var(--danger); color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 11.5px; cursor: pointer; float: right; margin-bottom: 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="container" id="app">
    <div id="phase-login">
        <div class="header">
            <img class="logo-img" src="assets/청춘한의원_로고-01.png" alt="청춘한의원">
            <div class="sub">사전문진시스템</div>
        </div>
        <div class="form-group">
            <label>이름</label>
            <input type="text" id="inp-name" placeholder="이름을 입력해주세요">
        </div>
        <div class="form-group">
            <label>전화번호</label>
            <input type="tel" id="inp-phone" placeholder="01012345678">
        </div>
        <button class="start-btn" onclick="goToRegister()">시작하기</button>
    </div>

    <div id="phase-register" style="display:none">
        <div class="header"><h1>신규등록</h1></div>
        <p style="font-size:14px;color:#666;margin-bottom:16px;line-height:1.6;">
            안녕하세요!<br>
            청춘한의원에 방문하신 것을 환영합니다.<br>
            보다 체계적인 의료서비스를 제공하기 위해 사전문진을 진행하고 있습니다.<br>
            가볍게, 기본정보부터 알려주시겠어요?
        </p>
        <div class="form-group">
            <label>생년월일</label>
            <div class="birth-row">
                <select id="inp-birth-y" onchange="updateChildFieldsVisibility()"><option value="">년도</option></select>
                <select id="inp-birth-m" onchange="updateChildFieldsVisibility()"><option value="">월</option></select>
                <select id="inp-birth-d" onchange="updateChildFieldsVisibility()"><option value="">일</option></select>
            </div>
        </div>
        <div class="form-group">
            <label>키 (cm)</label>
            <input type="number" id="inp-height" placeholder="170">
        </div>
        <div class="form-group">
            <label>몸무게 (kg)</label>
            <input type="number" id="inp-weight" placeholder="65">
        </div>
        <div class="form-group" id="parent-height-group" style="display:none;">
            <label>부모님 키 (소아 성장평가용)</label>
            <div class="birth-row">
                <input type="number" id="inp-father-height" placeholder="아버지 키 (cm)">
                <input type="number" id="inp-mother-height" placeholder="어머니 키 (cm)">
            </div>
        </div>
        <div class="form-group">
            <label>성별</label>
            <div class="gender-btns">
                <div class="gender-btn" onclick="selectGender(this,'남자')">남자</div>
                <div class="gender-btn" onclick="selectGender(this,'여자')">여자</div>
            </div>
        </div>
        <div class="consent-row">
            <input type="checkbox" id="consent1" checked>
            <label for="consent1">개인정보수집활용 동의 (필수)</label>
        </div>
        <button class="start-btn" onclick="goToStart()">다음</button>
    </div>

    <div id="phase-growth" style="display:none">
        <div class="header"><img class="logo-img" src="assets/청춘한의원_로고-01.png" alt="청춘한의원"></div>
        <div class="start-screen" style="text-align:left;padding:20px 4px;">
            <h2 style="text-align:center;">우리 아이 성장 확인</h2>
            <div id="growth-result"></div>
            <button class="start-btn" onclick="goToStartFromGrowth()">다음</button>
        </div>
    </div>

    <div id="phase-start" style="display:none">
        <div class="header"><img class="logo-img" src="assets/청춘한의원_로고-01.png" alt="청춘한의원"></div>
        <div class="start-screen">
            <h2>내 몸의 맞춤진단</h2>
            <p class="warn">마지막 페이지에서 "문진완료" 버튼을 누르셔야 문진이 완료됩니다.</p>
            <button class="start-btn" onclick="startQuestionnaire()">문진시작하기</button>
        </div>
    </div>

    <div id="phase-questions" style="display:none">
        <div class="header" style="padding:10px 0;">
            <img class="logo-img sm" src="assets/청춘한의원_로고-01.png" alt="청춘한의원">
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-text" id="progress-text">진행률 0%</div>
        <div id="question-area"></div>
        <div class="nav-btns">
            <button class="nav-btn prev" id="btn-prev" onclick="prevQuestion()">이전</button>
            <button class="nav-btn next" id="btn-next" onclick="nextQuestion()">다음</button>
        </div>
    </div>

    <div id="phase-complete" style="display:none">
        <div class="header"><img class="logo-img" src="assets/청춘한의원_로고-01.png" alt="청춘한의원"></div>
        <div class="complete-page" id="complete-box">
            <div class="icon">&#10004;</div>
            <h2>문진이 완료되었습니다</h2>
            <p>답변해주셔서 감사합니다.<br>원장님께서 확인 후 진료를 시작하겠습니다.<br>잠시만 기다려주세요.</p>
        </div>
    </div>
</div>

<script src="growth-data.js"></script>
<script src="questions.js"></script>
<script>
// ===== 구글시트 연동 주소 (Apps Script 배포 후 이 값을 교체하세요) =====
const GAS_URL = "https://script.google.com/macros/s/AKfycbzp_jMJK3Bq1mfwqa39mYQJdgIdKWkkIrrXaifMD3JY8QvzeWjyIlrpVwG-m7b70-RM/exec";

// Q 배열, visibleQ(), buildSummary() 는 questions.js 에서 불러옵니다 (관리자페이지와 공용).
let selectedGender = null;
let currentStep = 0;
let answers = {};
let patientInfo = {};
// 만 15세 이하인지 여부 (growth-data.js의 isChildAge()로 계산). questions.js의 술 문항 제외,
// 부모님 키 입력란 노출, 성장평가 화면 표시 여부에 공용으로 사용합니다.
let isChildPatient = false;

// id -> 질문 전체 텍스트(카테고리 포함 경로) 매핑 (요약 생성용)
const QMAP = {};
(function buildQMap(){
  Q.forEach(q => {
    QMAP[q.id] = {cat:q.cat, title:q.title};
    if (q.sub) {
      Object.keys(q.sub).forEach(k => {
        q.sub[k].forEach(sq => { QMAP[sq.id] = {cat:q.cat, title: sq.title || q.title}; });
      });
    }
    if (q.groups) {
      q.groups.forEach(g => g.items.forEach(it => { QMAP[it.id] = {cat:q.cat, title: it.text}; }));
    }
  });
})();

// 생년월일을 달력(월 단위 클릭) 대신 년/월/일 드롭다운으로 골라서, 수십 년 전으로
// 거슬러 올라가야 하는 환자도 빠르게 선택할 수 있게 합니다.
(function populateBirthSelects() {
    const ySel = document.getElementById('inp-birth-y');
    const mSel = document.getElementById('inp-birth-m');
    const dSel = document.getElementById('inp-birth-d');
    if (!ySel || !mSel || !dSel) return;
    const thisYear = new Date().getFullYear();
    for (let y = thisYear; y >= thisYear - 100; y--) {
        ySel.insertAdjacentHTML('beforeend', `<option value="${y}">${y}년</option>`);
    }
    for (let m = 1; m <= 12; m++) {
        mSel.insertAdjacentHTML('beforeend', `<option value="${m}">${m}월</option>`);
    }
    for (let d = 1; d <= 31; d++) {
        dSel.insertAdjacentHTML('beforeend', `<option value="${d}">${d}일</option>`);
    }
})();

function goToRegister() {
    const n = document.getElementById('inp-name').value.trim();
    const p = document.getElementById('inp-phone').value.trim();
    if (!n || !p) { alert('이름과 전화번호를 입력해주세요.'); return; }
    document.getElementById('phase-login').style.display = 'none';
    document.getElementById('phase-register').style.display = 'block';
}

function selectGender(el, g) {
    selectedGender = g;
    document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
}

// 생년월일 세 칸이 모두 채워질 때마다 호출 - 만 15세 이하면 부모님 키 입력란을 보여줍니다.
function updateChildFieldsVisibility() {
    const birthY = document.getElementById('inp-birth-y').value;
    const birthM = document.getElementById('inp-birth-m').value;
    const birthD = document.getElementById('inp-birth-d').value;
    const group = document.getElementById('parent-height-group');
    if (!birthY || !birthM || !birthD) { isChildPatient = false; group.style.display = 'none'; return; }
    const birth = `${birthY}-${String(birthM).padStart(2, '0')}-${String(birthD).padStart(2, '0')}`;
    isChildPatient = isChildAge(birth);
    group.style.display = isChildPatient ? 'block' : 'none';
}

function goToStart() {
    const name = document.getElementById('inp-name').value.trim();
    const phone = document.getElementById('inp-phone').value.trim();
    const birthY = document.getElementById('inp-birth-y').value;
    const birthM = document.getElementById('inp-birth-m').value;
    const birthD = document.getElementById('inp-birth-d').value;
    const height = document.getElementById('inp-height').value;
    const weight = document.getElementById('inp-weight').value;
    if (!selectedGender) { alert('성별을 선택해주세요.'); return; }
    if (!document.getElementById('consent1').checked) { alert('개인정보수집 동의가 필요합니다.'); return; }
    if ((birthY || birthM || birthD) && !(birthY && birthM && birthD)) {
        alert('생년월일을 년/월/일 모두 선택해주세요.');
        return;
    }
    const birth = birthY ? `${birthY}-${String(birthM).padStart(2, '0')}-${String(birthD).padStart(2, '0')}` : '';
    patientInfo = {name, phone, birth_date: birth, height: parseFloat(height) || '', weight: parseFloat(weight) || '', gender: selectedGender};

    let growth = null;
    if (isChildPatient && birth) {
        const fatherHeight = document.getElementById('inp-father-height').value;
        const motherHeight = document.getElementById('inp-mother-height').value;
        growth = evaluateGrowth({
            gender: selectedGender, birthDate: birth,
            heightCm: patientInfo.height, weightKg: patientInfo.weight,
            fatherHeight, motherHeight
        });
    }
    patientInfo.growth = growth;

    document.getElementById('phase-register').style.display = 'none';
    if (hasGrowthResult(growth)) {
        document.getElementById('growth-result').innerHTML = renderGrowthResult(growth);
        document.getElementById('phase-growth').style.display = 'block';
    } else {
        document.getElementById('phase-start').style.display = 'block';
    }
}

function goToStartFromGrowth() {
    document.getElementById('phase-growth').style.display = 'none';
    document.getElementById('phase-start').style.display = 'block';
}

// 소아 성장 평가 결과를 보호자가 보기 편한 카드 형태로 그립니다.
function renderGrowthResult(g) {
    let h = `<p style="color:var(--ink-500);font-size:13.5px;margin-bottom:18px;line-height:1.6;">입력하신 정보를 바탕으로 한 참고용 성장 평가입니다. 정확한 진단은 원장님과의 진료를 통해 확인해주세요.</p>`;
    h += `<div style="background:var(--brand-soft);border-radius:14px;padding:18px;margin-bottom:14px;">`;
    h += `<div style="font-weight:700;margin-bottom:10px;">만 ${g.ageYears}세 (${g.ageMonths}개월)</div>`;
    if (g.heightPercentile !== undefined) {
        h += `<div style="margin-bottom:8px;">📏 키: <b>${g.heightPercentile} 백분위수</b><br><span style="color:var(--ink-500);font-size:13px;">${g.heightDesc}</span></div>`;
    }
    if (g.weightPercentile !== undefined) {
        h += `<div>⚖️ 몸무게: <b>${g.weightPercentile} 백분위수</b><br><span style="color:var(--ink-500);font-size:13px;">${g.weightDesc}</span></div>`;
    }
    h += `</div>`;
    if (g.predictedHeight) {
        h += `<div style="background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;">`;
        h += `<div style="font-weight:700;margin-bottom:8px;">예상 성인키 (부모 키 기반 참고 추정치)</div>`;
        h += `<div style="font-size:24px;font-weight:800;color:var(--brand-1);">${g.predictedHeight.mid}cm</div>`;
        h += `<div style="color:var(--ink-500);font-size:13px;margin-top:4px;">추정 범위 ${g.predictedHeight.low}~${g.predictedHeight.high}cm</div>`;
        h += `</div>`;
    }
    h += `<p style="color:var(--ink-300);font-size:11.5px;margin-top:14px;line-height:1.6;">※ 2017년 질병관리청·대한소아과학회 소아청소년 성장도표 기준 통계적 추정치입니다. 영양·수면·사춘기 시기 등에 따라 실제 성장은 달라질 수 있습니다.</p>`;
    return h;
}

function startQuestionnaire() {
    document.getElementById('phase-start').style.display = 'none';
    document.getElementById('phase-questions').style.display = 'block';
    currentStep = 0;
    render();
}

function esc(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function isSelected(qId, opt, type) {
    if (type === 'single') return answers[qId] === opt;
    return (answers[qId] || []).includes(opt);
}

function renderSubBlock(subQuestions) {
    let h = '';
    subQuestions.forEach(sq => {
        if (sq.title) {
            h += `<div class="sub-hdr">${sq.title}</div>`;
        }
        if (sq.type === 'single') {
            sq.opts.forEach(o => {
                const s = isSelected(sq.id, o, 'single') ? ' sel' : '';
                h += `<div class="sub-opt${s}" onclick="pick('${sq.id}','${esc(o)}','single')">${o}</div>`;
            });
        } else if (sq.type === 'multi') {
            sq.opts.forEach(o => {
                const s = isSelected(sq.id, o, 'multi') ? ' sel' : '';
                h += `<div class="sub-chk${s}" onclick="pick('${sq.id}','${esc(o)}','multi')"><span class="chkbox"></span>${o}</div>`;
            });
        }
    });
    return h;
}

function render() {
    const list = visibleQ();
    const total = list.length;
    const q = list[currentStep];
    const pct = Math.round((currentStep / total) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent = '진행률 ' + pct + '%';

    let h = '';
    h += `<div class="step-info"><span class="cat">${q.cat}</span> <span class="num">${currentStep + 1} /${total}</span></div>`;
    h += `<div class="question-title">${q.title}</div>`;

    if (q.type === 'text') {
        h += `<textarea id="text-answer" style="width:100%;height:120px;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;resize:vertical;" placeholder="자유롭게 적어주세요...">${answers[q.id]||''}</textarea>`;
    } else if (q.type === 'single') {
        q.opts.forEach(o => {
            const s = isSelected(q.id, o, 'single') ? ' sel' : '';
            h += `<div class="opt${s}" onclick="pick('${q.id}','${esc(o)}','single')">${o}</div>`;
            if (s && q.sub && q.sub[o]) {
                h += `<div class="sub-block">${renderSubBlock(q.sub[o])}</div>`;
            }
        });
    } else if (q.type === 'multi') {
        q.opts.forEach(o => {
            const s = isSelected(q.id, o, 'multi') ? ' sel' : '';
            h += `<div class="opt${s}" onclick="pick('${q.id}','${esc(o)}','multi')">${o}</div>`;
            if (s && q.sub && q.sub[o]) {
                h += `<div class="sub-block">${renderSubBlock(q.sub[o])}</div>`;
            }
        });
    } else if (q.type === 'emotion') {
        q.groups.forEach(g => {
            h += `<div class="emo-card"><div class="emo-card-inner">`;
            h += `<div class="emo-icon" style="background:${g.bg};">${g.icon}</div>`;
            h += `<div class="emo-checks">`;
            g.items.forEach(item => {
                const checked = answers[item.id] === true;
                const sel = checked ? ' sel' : '';
                h += `<div class="emo-chk${sel}" onclick="toggleEmo('${item.id}')"><span class="ebox"></span>${item.text}</div>`;
            });
            h += `</div></div></div>`;
        });
        h += `<div class="emo-hint">해당사항이 없다면, 다음을 눌러주세요.</div>`;
    } else if (q.type === 'symptom_entry') {
        h += renderSymptomEntry();
    }

    document.getElementById('question-area').innerHTML = h;
    document.getElementById('btn-prev').disabled = currentStep === 0;
    document.getElementById('btn-next').textContent = currentStep === total - 1 ? '문진완료' : '다음';
    document.getElementById('btn-next').disabled = false;
}

function pick(qId, val, type) {
    val = val.replace(/\\'/g, "'");
    const isNA = val === '해당없음' || val === '해당 없음';
    if (type === 'single') {
        if (answers[qId] === val) {
            delete answers[qId];
        } else {
            answers[qId] = val;
        }
    } else {
        if (!answers[qId]) answers[qId] = [];
        const i = answers[qId].indexOf(val);
        if (i > -1) {
            answers[qId].splice(i, 1);
        } else {
            if (isNA) {
                answers[qId] = [val];
            } else {
                answers[qId] = answers[qId].filter(v => v !== '해당없음' && v !== '해당 없음');
                answers[qId].push(val);
            }
        }
        if (answers[qId].length === 0) delete answers[qId];
    }
    render();
}

function toggleEmo(itemId) {
    answers[itemId] = !answers[itemId];
    if (!answers[itemId]) delete answers[itemId];
    render();
}

// Symptom entry
if (!window._symptoms) window._symptoms = [{symptom:'',since:'',how:''}];

function renderSymptomEntry() {
    let h = '';
    window._symptoms.forEach((s, i) => {
        h += `<div class="symptom-entry">`;
        if (window._symptoms.length > 1) {
            h += `<button class="remove-symptom" onclick="removeSymptom(${i})">삭제</button>`;
        }
        h += `<div class="se-label">증상</div>`;
        h += `<textarea id="se-symptom-${i}" placeholder="예: 허리가 아프다" oninput="updateSymptom(${i},'symptom',this.value)">${s.symptom}</textarea>`;
        h += `<div class="se-label" style="margin-top:10px;">대략 언제부터 그랬나요?</div>`;
        h += `<textarea id="se-since-${i}" placeholder="예: 3개월 전부터" oninput="updateSymptom(${i},'since',this.value)">${s.since}</textarea>`;
        h += `<div class="se-label" style="margin-top:10px;">어떻게 아픈가요?</div>`;
        h += `<textarea id="se-how-${i}" placeholder="예: 오래 앉아있으면 더 아프다" oninput="updateSymptom(${i},'how',this.value)">${s.how}</textarea>`;
        h += `</div>`;
    });
    h += `<div class="add-symptom-btn" onclick="addSymptom()">+ 증상 추가</div>`;
    return h;
}

function updateSymptom(i, field, val) {
    window._symptoms[i][field] = val;
}

function addSymptom() {
    window._symptoms.push({symptom:'',since:'',how:''});
    render();
}

function removeSymptom(i) {
    window._symptoms.splice(i, 1);
    render();
}

function saveSymptomAnswers() {
    const filled = window._symptoms.filter(s => s.symptom.trim() || s.since.trim() || s.how.trim());
    if (filled.length > 0) {
        answers['symptoms'] = filled;
    }
}

function prevQuestion() {
    if (currentStep > 0) { currentStep--; render(); window.scrollTo(0, 0); }
}

function nextQuestion() {
    const list = visibleQ();
    const q = list[currentStep];
    if (q.type === 'text') {
        const ta = document.getElementById('text-answer');
        if (ta && ta.value) answers[q.id] = ta.value;
    }
    if (q.type === 'symptom_entry') {
        saveSymptomAnswers();
    }
    if (currentStep < list.length - 1) { currentStep++; render(); window.scrollTo(0, 0); }
    else { saveSymptomAnswers(); submit(); }
}

// buildSummary() 는 questions.js 에서 불러옵니다.

function buildSymptomText() {
    if (!answers['symptoms']) return '';
    return answers['symptoms'].map((s, i) =>
        `${i+1}. 증상: ${s.symptom || '-'} / 언제부터: ${s.since || '-'} / 양상: ${s.how || '-'}`
    ).join('\n');
}

function submit() {
    document.getElementById('btn-next').disabled = true;
    document.getElementById('btn-next').textContent = '제출 중...';

    // 소아 성장평가 결과는 answers._growth에 담아 원본데이터(JSON)에 함께 저장하고(관리자페이지에서
    // 카드로 표시), 문진 요약 맨 앞에도 텍스트로 덧붙여 구글시트에서 바로 읽을 수 있게 합니다.
    const growthText = buildGrowthSummaryText(patientInfo.growth);
    if (growthText) answers._growth = patientInfo.growth;
    const summaryText = growthText ? (growthText + '\n' + buildSummary()) : buildSummary();

    const payload = {
        name: patientInfo.name,
        phone: patientInfo.phone,
        birth_date: patientInfo.birth_date,
        height: patientInfo.height,
        weight: patientInfo.weight,
        gender: patientInfo.gender,
        summary: summaryText,
        symptoms: buildSymptomText(),
        raw: JSON.stringify(answers)
    };

    // Apps Script 웹앱은 CORS 응답 헤더를 주지 않아 응답을 읽으려 하면 실패 처리되므로
    // mode:'no-cors'로 보내 응답을 읽지 않고 전송 성공 여부만 확인한다.
    fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
        .then(() => showComplete(true))
        .catch(() => showComplete(false));
}

function showComplete(ok) {
    document.getElementById('phase-questions').style.display = 'none';
    document.getElementById('phase-complete').style.display = 'block';
    const box = document.getElementById('complete-box');
    if (ok) {
        box.classList.remove('error');
        box.innerHTML = `<div class="icon">&#10004;</div><h2>문진이 완료되었습니다</h2><p>답변해주셔서 감사합니다.<br>원장님께서 확인 후 진료를 시작하겠습니다.<br>잠시만 기다려주세요.</p>`;
    } else {
        box.classList.add('error');
        box.innerHTML = `<div class="icon">&#10060;</div><h2>제출 중 문제가 발생했습니다</h2><p>네트워크 연결을 확인하시고,<br>계속 안되면 접수처 직원에게 알려주세요.</p>`;
    }
}
</script>
