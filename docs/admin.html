<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청춘한의원 - 문진 관리</title>
<style>
:root {
  --brand-1: #2f3b8f;
  --brand-2: #6d4fc9;
  --brand-soft: #eef0fb;
  --ink-900: #1e2233;
  --ink-700: #454b5f;
  --ink-500: #757c92;
  --ink-300: #aeb3c4;
  --line: #e4e6f0;
  --line-soft: #eef0f7;
  --bg: #f4f5fa;
  --surface: #ffffff;
  --danger: #d64559;
  --danger-soft: #fdeef0;
  --success: #1f9d63;
  --warn: #a9750f;
  --warn-soft: #fdf3e2;
  --warn-line: #f2e3ba;
  --shadow-sm: 0 1px 3px rgba(24, 28, 56, 0.05);
  --shadow-md: 0 10px 28px rgba(28, 32, 64, 0.08);
  --shadow-lg: 0 18px 44px rgba(28, 32, 64, 0.14);
  --radius-lg: 18px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --c-teal: #0d9488;
  --c-teal-soft: #e1f6f2;
  --c-pink: #db2777;
  --c-pink-soft: #fce7f3;
  --c-blue: #2563eb;
  --c-blue-soft: #dbeafe;
  --c-orange: #ea580c;
  --c-orange-soft: #ffedd5;
  --c-violet: #7c3aed;
  --c-violet-soft: #f1e9fd;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; background: var(--bg); color: var(--ink-900); -webkit-font-smoothing: antialiased; }

/* ===== 대시보드 ===== */
.topbar { background: var(--surface); border-bottom: 4px solid transparent; border-image: linear-gradient(90deg, var(--c-violet), var(--c-pink), var(--c-orange), var(--c-teal), var(--c-blue)) 1; padding: 10px 22px; display: flex; justify-content: space-between; align-items: center; height: 52px; box-shadow: var(--shadow-md); }
.topbar .brand { font-weight: 700; font-size: 15px; color: var(--ink-900); letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.topbar .brand span { color: var(--brand-2); }
.topbar .brand .brand-logo { height: 20px; width: auto; }
.topbar .right { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--ink-500); }
.topbar button { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #fff; border: none; padding: 7px 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 12.5px; font-weight: 700; transition: box-shadow .15s; box-shadow: var(--shadow-sm); }
.topbar button:hover { box-shadow: var(--shadow-md); }

.layout { display: flex; height: calc(100vh - 52px); }
.sidebar { width: 300px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.sidebar-hdr { padding: 12px; border-bottom: 1px solid var(--line-soft); }
.sidebar-hdr input { width: 100%; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); font-size: 13px; margin-top: 10px; }
.sidebar-hdr input:focus { outline: none; border-color: var(--brand-2); }
.form-tabs { display: flex; gap: 8px; }
.form-tab { flex: 1; padding: 9px 4px; text-align: center; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--line); color: var(--ink-500); background: var(--surface); transition: all .15s; }
.form-tab:hover { border-color: var(--brand-2); }
.form-tab.herbal.active { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #fff; border-color: transparent; box-shadow: var(--shadow-sm); }
.form-tab.diet.active { background: linear-gradient(135deg, var(--c-orange), #f59e0b); color: #fff; border-color: transparent; box-shadow: var(--shadow-sm); }
.p-list { flex: 1; overflow-y: auto; }
.p-item { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); cursor: pointer; transition: background .1s; display: flex; gap: 10px; align-items: flex-start; }
.p-item:hover { background: #f7f8fd; }
.p-item:hover .p-del { opacity: 1; }
.p-item.active { background: var(--brand-soft); border-left: 4px solid var(--c-violet); padding-left: 12px; }
.p-item .p-num { font-size: 11px; font-weight: 700; color: var(--ink-300); min-width: 18px; flex-shrink: 0; margin-top: 1px; }
.p-item .p-body { flex: 1; min-width: 0; }
.p-item .nm { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px; color: var(--ink-900); }
.p-item .nm .gender-tag { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: var(--line-soft); color: var(--ink-500); }
.p-item .nm .gender-tag.male, .patient-card .name .gender-tag.male { background: var(--c-blue-soft); color: var(--c-blue); }
.p-item .nm .gender-tag.female, .patient-card .name .gender-tag.female { background: var(--c-pink-soft); color: var(--c-pink); }
.p-item .nm .gender-tag.child, .patient-card .name .gender-tag.child { background: var(--c-teal-soft); color: var(--c-teal); }
.p-item .inf { font-size: 11.5px; color: var(--ink-500); margin-top: 3px; }
.p-item .tm { font-size: 10.5px; color: var(--ink-300); margin-top: 2px; }
.p-item .p-del { flex-shrink: 0; opacity: 0; transition: opacity .15s; background: none; border: none; color: var(--ink-300); font-size: 15px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.p-item .p-del:hover { color: #fff; background: var(--danger); }
.empty-list { padding: 30px 16px; text-align: center; color: var(--ink-300); font-size: 13px; }

.detail { flex: 1; overflow-y: auto; padding: 26px 34px; }
.detail-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--ink-300); font-size: 14px; }

.patient-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 22px 34px; align-items: center; box-shadow: var(--shadow-sm); }
.patient-card .name { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.patient-card .name .gender-tag { font-size: 11px; font-weight: 700; margin-left: 8px; padding: 2px 9px; border-radius: 10px; background: var(--brand-soft); color: var(--brand-2); vertical-align: middle; }
.patient-card { border-top: 4px solid var(--c-violet); }
.patient-card .field { font-size: 12px; color: var(--ink-500); }
.patient-card .field b { display: block; font-size: 14px; color: var(--ink-900); font-weight: 700; margin-top: 2px; }
.patient-card .field .vital-hint { font-size: 10px; color: var(--c-orange); font-weight: 600; }
.patient-card .field b.vital-edit { display: flex; align-items: center; gap: 4px; }
.vital-input { width: 56px; border: 1.5px solid var(--c-orange-soft); background: var(--c-orange-soft); border-radius: 6px; padding: 3px 6px; font-size: 13px; font-weight: 700; color: var(--ink-900); font-family: inherit; }
.vital-input:focus { outline: none; border-color: var(--c-orange); background: var(--surface); }
.patient-card .copy-btn { margin-left: auto; background: var(--brand-soft); color: var(--brand-1); border: none; padding: 9px 16px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 700; cursor: pointer; transition: background .15s; }
.patient-card .copy-btn:hover { background: #e2e5f9; }

.bmi-section { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c-teal); border-radius: var(--radius-md); padding: 16px 20px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.bmi-section h3 { font-size: 13px; color: var(--c-teal); margin-bottom: 10px; font-weight: 700; }
.bmi-bar { display: flex; gap: 8px; align-items: flex-end; justify-content: center; flex-wrap: wrap; }
.bmi-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 8px 6px; border-radius: var(--radius-sm); min-width: 72px; }
.bmi-circle { width: 66px; height: 66px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; border: 2px solid var(--line); transition: all .15s; }
.bmi-circle-active { background: var(--brand-soft); border: 3px solid var(--brand-1); box-shadow: 0 0 0 3px rgba(47,59,143,0.14); }
.bmi-item .bmi-label { font-size: 11px; color: var(--ink-500); white-space: nowrap; font-weight: 600; }
.bmi-item .bmi-val { font-size: 10px; color: var(--ink-300); }
.bmi-item.active .bmi-label { color: var(--brand-1); }
.bmi-item.active .bmi-val { color: var(--brand-1); font-weight: 600; }
.bmi-note { font-size: 11.5px; color: var(--ink-300); text-align: center; margin-top: 8px; }

/* 체성분(체중/골격근량/체지방량) 측정 기록 + 변화 추이 그래프 - 다이어트 탭 전용 */
.bc-section { border-left-color: var(--c-blue); }
.bc-section h3 { color: var(--c-blue); }
.bc-section .sub { font-size: 11.5px; color: var(--ink-300); margin-bottom: 12px; }
.bc-chart { width: 100%; overflow-x: auto; }
.bc-gridtitle { font-size: 12.5px; font-weight: 800; color: var(--ink-900); margin: 2px 0 8px; }
.bc-grid svg { border: 1px solid var(--line); border-radius: 8px; }
.bc-legend { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 8px 0 4px; font-size: 12px; color: var(--ink-700); }
.bc-leg { display: inline-flex; align-items: center; gap: 5px; }
.bc-leg i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.bc-leg b { color: var(--ink-900); }
.bc-delta { font-weight: 700; font-size: 11.5px; padding: 1px 6px; border-radius: 8px; }
.bc-delta.up-good { background: var(--c-teal-soft); color: var(--c-teal); }
.bc-delta.down-bad { background: var(--danger-soft); color: var(--danger); }
.bc-empty { text-align: center; color: var(--ink-300); font-size: 12.5px; padding: 24px 0; }
.bc-note { font-size: 11px; color: var(--ink-500); margin: 6px 0; text-align: center; }
.bc-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
.bc-table th { background: var(--bg); color: var(--ink-500); font-weight: 700; padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--line); }
.bc-table td { padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--line-soft); color: var(--ink-900); }
.bc-table td.bc-memo { text-align: left; color: var(--ink-500); }
.bc-del { background: none; border: none; color: var(--ink-300); cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 6px; }
.bc-del:hover { background: var(--danger); color: #fff; }
.bc-form { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.bc-form label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--ink-500); font-weight: 600; }
.bc-form input { border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; font-family: inherit; width: 104px; }
.bc-form input:focus { outline: none; border-color: var(--c-blue); }
.bc-form input[type="date"] { width: 160px; }
.bc-form .bc-memo-in input { width: 160px; }
.bc-add { background: linear-gradient(135deg, var(--c-blue), var(--c-violet)); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.bc-add:hover { box-shadow: var(--shadow-sm); }
.bc-src { border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; font-family: inherit; background: var(--surface); }
.bc-src:focus { outline: none; border-color: var(--c-blue); }
.bc-table .src-tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 7px; }
.bc-table .src-tag.clinic { background: var(--c-blue-soft); color: var(--c-blue); }
.bc-table .src-tag.self { background: var(--c-orange-soft); color: var(--c-orange); }
.bc-caption { font-size: 10.5px; color: var(--ink-300); text-align: center; margin-top: 3px; }

/* 진료 방식(직접 내원 / 전화 비대면) - 원장이 상세 화면에서 표시, 목록에 배지로 노출 */
.vt-toggle { display: inline-flex; gap: 4px; margin-top: 2px; }
.vt-btn { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-500); font-size: 11.5px; font-weight: 700; padding: 4px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; }
.vt-btn:hover { border-color: var(--c-blue); }
.vt-btn.on { background: var(--c-blue); color: #fff; border-color: var(--c-blue); }
.vt-btn.on.phone { background: var(--c-orange); border-color: var(--c-orange); }
.p-item .visit-tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; }
.p-item .visit-tag.clinic { background: var(--c-blue-soft); color: var(--c-blue); }
.p-item .visit-tag.phone { background: var(--c-orange-soft); color: var(--c-orange); }

/* 형색성정: 성향/면색/붉은기/기타/안진 - 모두 원장님이 진료 중 직접 판단해 표시 (자동 아님) */
.hss-section { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c-violet); border-radius: var(--radius-md); padding: 16px 20px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.hss-section h3 { font-size: 13px; color: var(--c-violet); margin-bottom: 4px; font-weight: 700; }
.hss-section .sub { font-size: 11.5px; color: var(--ink-300); margin-bottom: 12px; }
.hss-two { display: flex; gap: 28px; }
.hss-left { flex: 1; min-width: 0; }
.hss-right { flex: 1.15; min-width: 0; }
.hss-sub { font-size: 11.5px; color: var(--ink-900); font-weight: 700; margin: 12px 0 6px; }
.hss-sub:first-child { margin-top: 0; }
.dot-scale { display: flex; align-items: center; gap: 6px; }
.dot-scale .end-label { font-size: 11.5px; color: var(--ink-500); font-weight: 600; min-width: 30px; }
.dot-scale .end-label.right { text-align: right; }
.dot-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; transition: all .15s; flex-shrink: 0; }
.dot-btn:hover { border-color: var(--c-violet); }
.dot-btn.active { background: var(--c-violet); border-color: var(--c-violet); }
.tag-group { display: flex; gap: 6px; flex-wrap: wrap; }
.tag-btn { padding: 5px 12px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); font-size: 11.5px; cursor: pointer; background: var(--surface); color: var(--ink-900); transition: all .15s; }
.tag-btn:hover { border-color: var(--c-violet); }
.tag-btn.active { background: var(--c-violet); color: #fff; border-color: var(--c-violet); }
.anjin-title { font-size: 11.5px; color: var(--ink-900); font-weight: 700; margin-bottom: 8px; }
.anjin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; }
.anjin-item { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line-soft); font-size: 11.5px; gap: 8px; }
.anjin-item .aj-name { color: var(--ink-700); }
.star-group { display: flex; gap: 1px; flex-shrink: 0; }
.star-btn { font-size: 16px; color: var(--line); cursor: pointer; line-height: 1; transition: color .1s; }
.star-btn.on { color: #f0b93d; }
.star-btn:hover { color: #f0b93d; }

.symptom-box { background: var(--warn-soft); border: 1px solid var(--warn-line); border-left: 4px solid var(--warn); border-radius: var(--radius-md); padding: 16px 20px; margin-bottom: 18px; }
.symptom-box h3 { font-size: 13px; color: var(--warn); margin-bottom: 8px; font-weight: 700; }
.symptom-box pre { white-space: pre-wrap; font-family: inherit; font-size: 13.5px; line-height: 1.7; color: #6b4f16; }

/* 두 칸 레이아웃: 왼쪽 문진 내용 / 오른쪽 주증상·메모 */
.two-col { display: flex; gap: 16px; align-items: flex-start; }
.col-main { flex: 1; min-width: 0; }
.col-side { width: 320px; flex-shrink: 0; }

.side-box { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c-blue); border-radius: var(--radius-md); padding: 16px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.side-box.cc { border-top-color: var(--c-orange); }
.side-box.memo { border-top-color: var(--c-teal); }
.side-box.ai { border-top-color: var(--c-violet); }
.side-box.presc { border-top-color: var(--c-pink); }
.side-box-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.side-box-hdr h3 { font-size: 13px; color: var(--ink-900); font-weight: 700; }
.side-btn { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #fff; border: none; padding: 5px 12px; border-radius: var(--radius-sm); font-size: 11.5px; font-weight: 700; cursor: pointer; transition: box-shadow .15s; }
.side-btn:hover { box-shadow: var(--shadow-sm); }
.side-btn.ghost { background: var(--brand-soft); color: var(--brand-1); }
.side-btn.ghost:hover { background: #e2e5f9; }

/* AI 처방 추천 */
.ai-run-btn { width: 100%; background: linear-gradient(135deg, var(--c-violet), var(--c-pink)); color: #fff; border: none; padding: 11px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-sm); transition: box-shadow .15s; }
.ai-run-btn:hover { box-shadow: var(--shadow-md); }
.ai-run-btn:disabled { opacity: .6; cursor: not-allowed; }
.ai-status { font-size: 12px; color: var(--ink-500); margin-top: 8px; white-space: pre-wrap; word-break: break-all; }
.ai-status.err { color: var(--danger); font-weight: 600; }
.ai-note { font-size: 11px; color: var(--ink-300); margin-top: 6px; line-height: 1.5; }
.ai-candidate { border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 10px; cursor: pointer; transition: border-color .15s, background .15s; }
.ai-candidate:hover { border-color: var(--brand-2); background: #fbfbff; }
.ai-cand-top { display: flex; align-items: baseline; gap: 8px; }
.ai-cand-rank { font-size: 10.5px; font-weight: 700; color: #fff; background: var(--ink-300); border-radius: 8px; padding: 1px 7px; flex-shrink: 0; }
.ai-candidate:nth-child(1) .ai-cand-rank { background: var(--brand-1); }
.ai-cand-name { font-size: 13px; font-weight: 700; color: var(--ink-900); flex: 1; }
.ai-cand-fit { font-size: 12.5px; font-weight: 700; color: var(--brand-1); }
.ai-fit-bar { height: 5px; background: var(--line-soft); border-radius: 4px; margin: 6px 0; overflow: hidden; }
.ai-fit-fill { height: 100%; background: linear-gradient(90deg, var(--brand-1), var(--brand-2)); border-radius: 4px; }
.ai-cand-note { font-size: 11.5px; color: var(--ink-500); }
.ai-toggle { font-size: 10.5px; color: var(--brand-2); margin-top: 6px; text-decoration: underline; }
.ai-reasons { font-size: 11px; margin-top: 6px; line-height: 1.6; }
.ai-reasons .m { color: var(--success); }
.ai-reasons .x { color: var(--ink-500); }
.ai-questions { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.ai-questions h4 { font-size: 12px; color: var(--ink-900); margin-bottom: 6px; }
.ai-questions ul { padding-left: 18px; }
.ai-questions li { font-size: 11.5px; color: var(--ink-700); margin-bottom: 8px; line-height: 1.5; }
.ai-q-reason { font-size: 10.5px; color: var(--ink-300); margin-top: 2px; }

.cc-card { border: 1px solid var(--line-soft); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 12px; }
.cc-card:last-child { margin-bottom: 0; }
.cc-remove { text-align: right; font-size: 10.5px; color: var(--danger); cursor: pointer; padding: 4px 8px 0; }
.cc-row { display: flex; align-items: stretch; border-top: 1px solid var(--line-soft); }
.cc-row:first-child { border-top: none; }
.cc-row.shaded { background: #f8f8fc; }
.cc-label { width: 60px; flex-shrink: 0; background: var(--ink-500); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 4px; }
.cc-label.cc-cc { background: var(--c-violet); }
.cc-label.cc-os { background: var(--c-teal); }
.cc-label.cc-symptom { background: var(--c-orange); }
.cc-label.cc-worse { background: var(--danger); }
.cc-label.cc-better { background: var(--success); }
.cc-input { flex: 1; border: none; background: transparent; font-size: 12.5px; padding: 8px 10px; resize: vertical; min-height: 34px; font-family: inherit; color: var(--ink-900); }
.cc-input:focus { outline: none; background: #fbfbff; }

.memo-textarea { width: 100%; border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 10px; font-size: 12.5px; resize: vertical; min-height: 90px; font-family: inherit; color: var(--ink-900); }
.memo-textarea:focus { outline: none; border-color: var(--brand-2); }
.memo-textarea.big { min-height: 320px; }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 20px; }
.cat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
.cat-card .cat-hdr { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #fff; font-size: 12.5px; font-weight: 700; padding: 9px 16px; }
.cat-card:nth-child(4n+2) .cat-hdr { background: linear-gradient(135deg, var(--c-teal), #16a34a); }
.cat-card:nth-child(4n+3) .cat-hdr { background: linear-gradient(135deg, var(--c-orange), var(--c-pink)); }
.cat-card:nth-child(4n+4) .cat-hdr { background: linear-gradient(135deg, var(--c-blue), var(--c-violet)); }
.cat-card .cat-body { padding: 12px 16px; }
.qa-row { font-size: 13px; line-height: 1.6; padding: 6px 0; border-bottom: 1px dashed var(--line-soft); }
.qa-row:last-child { border-bottom: none; }
.qa-row .q { color: var(--ink-500); }
.qa-row .a { color: var(--ink-900); font-weight: 600; }
.qa-sub { font-size: 12px; color: var(--ink-500); padding: 2px 0 2px 12px; }
.qa-sub b { color: var(--ink-700); font-weight: 600; }

/* 문진 답변 수정 UI */
.save-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.save-bar button { background: linear-gradient(135deg, var(--c-violet), var(--c-pink)); color: #fff; border: none; padding: 11px 22px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-md); transition: transform .1s, box-shadow .15s; }
.save-bar button:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.save-bar.top { padding: 12px 14px; background: var(--brand-soft); border-radius: var(--radius-md); }
.save-status { font-size: 12px; color: var(--ink-500); }
.save-status.ok { color: var(--success); font-weight: 600; }
.save-status.err { color: var(--danger); font-weight: 600; }
.edit-opts { display: flex; flex-wrap: wrap; gap: 3px 14px; margin: 3px 0 2px; }
.edit-opt, .edit-chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-900); cursor: pointer; }
.edit-opt input, .edit-chk input { width: 15px; height: 15px; accent-color: var(--brand-1); cursor: pointer; margin: 0; }
.qa-sub-block { margin: 2px 0 8px 14px; padding-left: 10px; border-left: 2px solid var(--line-soft); }
.qa-sub-title { font-size: 11.5px; color: var(--brand-2); font-weight: 600; margin: 4px 0 2px; }

.raw-toggle { font-size: 12px; color: var(--ink-300); cursor: pointer; margin-bottom: 8px; display: inline-block; }
.raw-box { display: none; background: var(--line-soft); border-radius: var(--radius-sm); padding: 12px; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--ink-500); white-space: pre-wrap; word-break: break-all; margin-bottom: 20px; }

.status-line { font-size: 12px; color: var(--ink-300); padding: 0 22px; }

/* 모바일에서 목록 <-> 상세를 전환할 때 상단에 뜨는 "목록으로" 바 (좁은 화면에서만 노출) */
#m-tabbar { display: none; }
#m-back { width: 100%; background: var(--brand-soft); color: var(--brand-1); border: none; padding: 11px 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; text-align: left; font-family: inherit; }

@media (max-width: 1000px) {
  .two-col { flex-direction: column; }
  .col-side { width: 100%; }
  .hss-two { flex-direction: column; gap: 4px; }
  .anjin-grid { grid-template-columns: 1fr; }
}

/* ===== 모바일 레이아웃: 목록과 상세를 화면 전체로 번갈아 표시 ===== */
@media (max-width: 820px) {
  .topbar { height: auto; min-height: 52px; padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
  .topbar .brand { font-size: 14px; white-space: nowrap; }
  .topbar .brand .brand-logo { height: 18px; }
  .topbar .right { gap: 8px; font-size: 11px; flex: 1; justify-content: flex-end; min-width: 0; }
  .topbar #last-updated { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar button { padding: 7px 12px; font-size: 12px; white-space: nowrap; flex-shrink: 0; }

  .layout { flex-direction: column; height: auto; }
  .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--line); }
  .p-list { overflow-y: visible; }
  .detail { padding: 16px 13px; overflow-y: visible; }

  #m-tabbar { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 12px; box-shadow: var(--shadow-sm); }
  body.m-detail #m-tabbar { display: block; }
  body.m-detail .sidebar { display: none; }
  body:not(.m-detail) .detail { display: none; }

  .cat-grid { grid-template-columns: 1fr; }
  .patient-card { padding: 16px; gap: 12px 20px; }
  .patient-card .name { font-size: 18px; }
  .patient-card .copy-btn { margin-left: 0; }
  .detail { font-size: 14px; }
}
</style>
</head>
<body>

<div id="dash">
  <div class="topbar">
    <div class="brand"><img class="brand-logo" src="assets/청춘한의원_로고-01.png" alt="청춘한의원"> <span>문진 관리</span></div>
    <div class="right">
      <span id="last-updated"></span>
      <button onclick="refreshAll()">새로고침</button>
    </div>
  </div>
  <div id="m-tabbar"><button id="m-back" onclick="exitMobileDetail()">← 환자 목록으로</button></div>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-hdr">
        <div class="form-tabs">
          <div class="form-tab herbal active" id="tab-herbal" onclick="switchForm('herbal')">🌿 한약문진</div>
          <div class="form-tab diet" id="tab-diet" onclick="switchForm('diet')">🥗 다이어트문진</div>
        </div>
        <input type="text" id="search" placeholder="이름 또는 전화번호 검색" oninput="renderList()">
      </div>
      <div class="p-list" id="p-list"></div>
    </div>
    <div class="detail" id="detail">
      <div class="detail-empty">왼쪽 목록에서 환자를 선택해주세요.</div>
    </div>
  </div>
</div>

<script src="growth-data.js"></script>
<script src="questions.js"></script>
<script src="questions-diet.js"></script>
<script>
// docs/index.html 의 GAS_URL 과 동일한 주소를 사용합니다.
const GAS_URL = "https://script.google.com/macros/s/AKfycbzp_jMJK3Bq1mfwqa39mYQJdgIdKWkkIrrXaifMD3JY8QvzeWjyIlrpVwG-m7b70-RM/exec";

// 원장님 혼자만 쓰는 페이지라 비밀번호 입력 없이 바로 불러옵니다.
// Code.gs의 ADMIN_KEY와 같은 값이며, 이 값은 google-apps-script/Code.gs에도
// 그대로 적혀 있어(그 파일이 이미 공개 저장소에 있음) 별도로 숨겨도 의미가 없습니다.
const adminKey = '3133';
let records = [];
let selectedIdx = null;

// 한약문진 / 다이어트문진 탭 전환용. 두 탭의 목록·선택 상태는 서로 독립적으로 유지합니다.
let activeForm = 'herbal'; // 'herbal' | 'diet'
let dietRecords = [];
let selectedDietIdx = null;
let dietNotes = { memo: '' };
let editingDietRowNum = null;
// 다이어트 문진 답변 수정용 (questions-diet.js 의 DIET_Q/visibleDietQ/buildDietSummary가 참조).
// 한약 문진의 answers와 이름이 겹치지 않도록 별도 변수로 둡니다.
let dietAnswers = {};
let hasEditableDietAnswers = false;

// 문진 답변 수정용 (questions.js 의 Q/visibleQ/buildSummary 가 참조하는 전역 변수).
// 환자를 새로 선택했을 때만 r.raw로 채우고, 그 이후 같은 환자를 다시 그릴 때는
// (원장님이 클릭해서 고친 내용이 사라지지 않도록) 이미 채워진 값을 그대로 씁니다.
let answers = {};
let selectedGender = null;
// 만 15세 이하 소아 여부 (growth-data.js의 isChildAge()로 계산). 소아면 questions.js가 문진 답변
// 수정 UI에서도 Q 대신 QC(소아 전용 문항)를 쓰도록 하기 위해 사용합니다.
let isChildPatient = false;
// 소아 연령대(영유아/아동/청소년, growth-data.js의 childAgeTier()) - QC 내 연령대별 문항 노출에 사용.
let childTier = null;
let editingRowNum = null;
// 현재 열린 환자가 실제 문진 답변 수정 UI(라디오/체크박스)를 보여주고 있는지 여부.
// true일 때만 통합 저장 버튼이 raw/summary도 함께 저장합니다.
let hasEditableAnswers = false;

// 환자가 문진에서 적어낸 키/몸무게(다이어트 탭은 감량목표도)를 원장님이 직접 고칠 수 있게 하는 값.
// (일부러 체중을 속여 적는 환자가 있어, 진료 중 실측치로 바로 잡을 수 있어야 함)
// editingRowNum(다이어트는 editingDietRowNum)이 바뀔 때만 원본 값으로 초기화합니다.
let editedVitals = { height: '', weight: '', goal: '' };

// 주증상(CC)/진료메모/처방메모 - 원장님이 진료 중 직접 채워 넣는 항목.
// editingRowNum이 바뀔 때(환자를 새로 열 때)만 초기화합니다.
let doctorNotes = { cc: [], memo: '', prescription: '', tendency: null, myunsaek: null, bulgeun: null, gita: [], anjin: {} };

// AI 처방 추천 결과(마지막으로 받은 것) - "근거 보기"/"처방메모에 담기" 버튼에서 참조합니다.
let lastAiResult = null;

loadData();
loadDietData();

// 구글시트가 "01090261075" 같은 전화번호를 숫자로 자동 인식해서 맨 앞 0이 사라지는 경우가 있어
// (이때 r.phone은 문자열이 아니라 숫자가 되어 .includes() 검색도 깨집니다), 불러온 직후 복구합니다.
function formatPhone(v) {
  if (v === undefined || v === null || v === '') return '';
  let s = String(v).trim();
  if (/^[1-9][0-9]{8,9}$/.test(s)) s = '0' + s;
  return s;
}
function normalizeRecord(r) { return Object.assign({}, r, { phone: formatPhone(r.phone) }); }

// 목록/상세에서 성별 태그 옆에 "소아" 표시를 붙일지 판단 (growth-data.js의 isChildAge, 만 15세 이하).
function childTagHtml(r) {
  return (r.birthDate && isChildAge(r.birthDate)) ? '<span class="gender-tag child">소아</span>' : '';
}

// 목록에서 이름 옆에 "(만나이세)"를 붙이기 위한 라벨 (growth-data.js의 ageInYears 사용).
function ageLabel(r) {
  if (!r.birthDate) return '';
  const y = ageInYears(r.birthDate);
  return (y === null || y === undefined) ? '' : `(${y}세)`;
}

function genderClass(g) {
  if (!g) return '';
  if (g.indexOf('남') === 0) return 'male';
  if (g.indexOf('여') === 0) return 'female';
  return '';
}

function refreshAll() {
  loadData();
  loadDietData();
}

// 좁은 화면(모바일)에서는 목록과 상세를 한 화면씩 번갈아 보여줍니다.
// body.m-detail 이 붙어 있으면 상세 화면, 없으면 목록 화면입니다. (넓은 화면에서는 CSS가 무시)
function isMobileView() { return window.matchMedia('(max-width: 820px)').matches; }

function enterMobileDetail() {
  if (isMobileView() && !document.body.classList.contains('m-detail')) {
    document.body.classList.add('m-detail');
    window.scrollTo(0, 0);
    // 상세를 열 때 방문기록을 하나 추가해 둡니다. 이렇게 하면 휴대폰의 뒤로가기
    // 버튼을 눌렀을 때 페이지(브라우저)가 닫히지 않고 환자 목록으로 돌아옵니다.
    history.pushState({ mDetail: true }, '');
  }
}

// fromPop=true 는 뒤로가기(popstate)로 호출된 경우. 이때는 이미 방문기록이 하나
// 소비된 상태이므로 history.back() 을 또 부르지 않습니다.
function exitMobileDetail(fromPop) {
  if (!document.body.classList.contains('m-detail')) return;
  document.body.classList.remove('m-detail');
  if (!fromPop && history.state && history.state.mDetail) history.back();
}

// 휴대폰/브라우저의 뒤로가기 버튼 처리: 상세 화면이면 목록으로만 돌아가고 페이지는 벗어나지 않습니다.
window.addEventListener('popstate', function () {
  if (document.body.classList.contains('m-detail')) exitMobileDetail(true);
});

// 한약문진/다이어트문진 탭 전환. 두 탭의 목록/선택 상태는 서로 건드리지 않고 그대로 유지합니다.
function switchForm(form) {
  activeForm = form;
  document.getElementById('tab-herbal').classList.toggle('active', form === 'herbal');
  document.getElementById('tab-diet').classList.toggle('active', form === 'diet');
  document.getElementById('search').value = '';
  renderList();
  document.getElementById('detail').innerHTML = '<div class="detail-empty">왼쪽 목록에서 환자를 선택해주세요.</div>';
  exitMobileDetail();
}

async function loadDietData() {
  try {
    const res = await fetch(GAS_URL + '?key=' + encodeURIComponent(adminKey) + '&type=diet');
    const data = await res.json();
    if (Array.isArray(data)) {
      dietRecords = data.map(normalizeRecord);
      if (activeForm === 'diet') {
        renderList();
        if (selectedDietIdx !== null) renderDietDetail(selectedDietIdx);
      }
      updateTimestamp();
    }
  } catch (e) { /* 조용히 실패 - 다음 새로고침에서 재시도 */ }
}

async function loadData() {
  const statusEl = document.getElementById('last-updated');
  if (statusEl && records.length === 0) statusEl.textContent = '불러오는 중...';
  try {
    const res = await fetch(GAS_URL + '?key=' + encodeURIComponent(adminKey));
    const data = await res.json();
    if (Array.isArray(data)) {
      records = data.map(normalizeRecord);
      if (activeForm === 'herbal') {
        renderList();
        if (selectedIdx !== null) renderDetail(selectedIdx);
      }
      updateTimestamp();
    } else if (statusEl) {
      statusEl.textContent = '서버 응답에 문제가 있습니다.';
    }
  } catch (e) {
    if (statusEl) statusEl.textContent = '서버에 연결하지 못했습니다. 새로고침을 눌러주세요.';
  }
}

function updateTimestamp() {
  const now = new Date();
  document.getElementById('last-updated').textContent =
    '마지막 새로고침 ' + now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

function renderList() {
  const kw = (document.getElementById('search').value || '').trim();
  const list = document.getElementById('p-list');
  const isDiet = activeForm === 'diet';
  const src = isDiet ? dietRecords : records;
  const curIdx = isDiet ? selectedDietIdx : selectedIdx;
  const openFn = isDiet ? 'renderDietDetail' : 'renderDetail';
  const filtered = src
    .map((r, i) => ({ r, i }))
    .filter(({ r }) => !kw || (r.name || '').includes(kw) || (r.phone || '').includes(kw));

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-list">아직 접수된 ${isDiet ? '다이어트' : '한약'} 문진이 없습니다.</div>`;
    return;
  }

  // src는 최신 제출이 맨 앞(index 0)에 오도록 정렬되어 있으므로,
  // 가장 오래된 접수가 1번이 되도록 뒤에서부터 번호를 매깁니다 (목록에 보이는 순서 자체는 최신순 그대로 유지).
  list.innerHTML = filtered.map(({ r, i }) => {
    const dt = r.submittedAt ? new Date(r.submittedAt) : null;
    const dtText = dt ? dt.toLocaleString('ko-KR', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
    const genderTag = r.gender ? `<span class="gender-tag ${genderClass(r.gender)}">${r.gender}</span>` : '';
    const visitTag = isDiet ? visitTagHtml(dietVisitTypeOf(r)) : '';
    const num = src.length - i;
    return `<div class="p-item${i === curIdx ? ' active' : ''}" onclick="${openFn}(${i})">
      <span class="p-num">${num}</span>
      <div class="p-body">
        <div class="nm">${esc(r.name || '(이름없음)')}${ageLabel(r)} ${genderTag}${childTagHtml(r)}${visitTag}</div>
        <div class="inf">${esc(r.phone || '')}</div>
        <div class="tm">${dtText}</div>
      </div>
      <button class="p-del" title="삭제" onclick="event.stopPropagation(); deleteRecord(${r.rowNum}, '${escJsAttr(r.name || '(이름없음)')}')">&#10005;</button>
    </div>`;
  }).join('');
}

// 관리자페이지에서 잘못 접수된 문진(테스트 접수, 중복 등)을 완전히 삭제합니다.
// 구글시트에서 실제로 행이 지워지는 되돌릴 수 없는 작업이라, 클릭할 때마다 반드시 확인을 받습니다.
function deleteRecord(rowNum, name) {
  if (!confirm(`${name}님의 문진 기록을 정말 삭제하시겠습니까?\n\n구글시트에서 완전히 삭제되며, 되돌릴 수 없습니다.`)) return;

  const isDiet = activeForm === 'diet';
  const payload = { action: 'delete', key: adminKey, rowNum: rowNum };
  if (isDiet) payload.formType = 'diet';
  fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) })
    .then(res => res.json())
    .then(data => {
      if (!data || data.status !== 'ok') {
        alert((data && data.message) || '삭제에 실패했습니다.');
        return;
      }
      // rowNum이 밀려서 다른 환자들의 행 번호도 바뀌므로, 서버에서 다시 불러와 목록을 맞춥니다.
      if (isDiet) {
        if (selectedDietIdx !== null && dietRecords[selectedDietIdx] && dietRecords[selectedDietIdx].rowNum === rowNum) {
          selectedDietIdx = null;
          document.getElementById('detail').innerHTML = '<div class="detail-empty">왼쪽 목록에서 환자를 선택해주세요.</div>';
          exitMobileDetail();
        }
        loadDietData();
        return;
      }
      if (selectedIdx !== null && records[selectedIdx] && records[selectedIdx].rowNum === rowNum) {
        selectedIdx = null;
        document.getElementById('detail').innerHTML = '<div class="detail-empty">왼쪽 목록에서 환자를 선택해주세요.</div>';
        exitMobileDetail();
      }
      loadData();
    })
    .catch(() => {
      alert('서버에 연결하지 못했습니다. 네트워크를 확인해주세요.');
    });
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ===== BMI 자동 계산 및 체형 그림 =====
function calcBMI(h, w) {
  h = parseFloat(h); w = parseFloat(w);
  if (!h || !w) return null;
  return w / ((h / 100) * (h / 100));
}

function getBMICategory(bmi) {
  if (!bmi) return -1;
  if (bmi < 18.5) return 0;
  if (bmi < 20) return 1;
  if (bmi < 23) return 2;
  if (bmi < 25) return 3;
  if (bmi < 27.5) return 4;
  if (bmi < 30) return 5;
  return 6;
}

// 어깨~허리~엉덩이를 잇는 몸통 윤곽선(둥근 사다리꼴) 경로를 만듭니다.
// 팔다리는 몸통과 분리해서 따로 그리기 때문에, 몸통은 엉덩이 아래를 둥글게 마감합니다.
function torsoPath(cx, shoulderW, waistW, hipW, shoulderY, waistY, hipY, hipBottomY) {
  return `
    M ${cx - shoulderW} ${shoulderY}
    Q ${cx} ${shoulderY - 6} ${cx + shoulderW} ${shoulderY}
    C ${cx + shoulderW + 2} ${shoulderY + 9}, ${cx + waistW + 1} ${waistY - 9}, ${cx + waistW} ${waistY}
    C ${cx + waistW - 1} ${waistY + 5}, ${cx + hipW} ${hipY - 5}, ${cx + hipW} ${hipY}
    Q ${cx + hipW * 0.6} ${hipBottomY} ${cx} ${hipBottomY}
    Q ${cx - hipW * 0.6} ${hipBottomY} ${cx - hipW} ${hipY}
    C ${cx - hipW} ${hipY - 5}, ${cx - waistW + 1} ${waistY + 5}, ${cx - waistW} ${waistY}
    C ${cx - waistW - 1} ${waistY - 9}, ${cx - shoulderW - 2} ${shoulderY + 9}, ${cx - shoulderW} ${shoulderY}
    Z`;
}

// 머리/목/몸통/팔다리를 분리해서 그리는 사람 실루엣 (첨부 도안 스타일: 팔은 몸통에서
// 살짝 떨어져 손이 보이고, 다리도 사이가 벌어져 각각 발이 보입니다).
// widthScale(0~1)이 커질수록 어깨/허리/엉덩이/팔다리가 굵어져 비만도를 표현합니다.
function personSVG(o) {
  const cx = o.cx;
  const shoulderW = o.shoulderBase + o.ws * o.shoulderGrow;
  const waistW = o.waistBase + o.ws * o.waistGrow;
  const hipW = waistW * o.hipRatio;
  const armW = o.armBase + o.ws * o.armGrow;
  const legW = o.legBase + o.ws * o.legGrow;

  const torso = torsoPath(cx, shoulderW, waistW, hipW, o.shoulderY, o.waistY, o.hipY, o.hipBottomY);

  const armLx1 = cx - shoulderW + 2, armLy1 = o.shoulderY + 2;
  const armLx2 = cx - shoulderW - 3, armLy2 = o.waistY + o.armDrop;
  const armRx1 = cx + shoulderW - 2, armRy1 = o.shoulderY + 2;
  const armRx2 = cx + shoulderW + 3, armRy2 = o.waistY + o.armDrop;

  const legLx1 = cx - o.legGap / 2 - legW * 0.3, legLy1 = o.hipY + 1;
  const legLx2 = legLx1 - 1.4, legLy2 = o.legBottomY;
  const legRx1 = cx + o.legGap / 2 + legW * 0.3, legRy1 = o.hipY + 1;
  const legRx2 = legRx1 + 1.4, legRy2 = o.legBottomY;

  return `<svg viewBox="0 0 60 ${o.viewH}" width="${o.dispW}" height="${o.dispH}">
    <line x1="${legLx1}" y1="${legLy1}" x2="${legLx2}" y2="${legLy2}" stroke="${o.strokeC}" stroke-width="${legW + 1.6}" stroke-linecap="round"/>
    <line x1="${legRx1}" y1="${legRy1}" x2="${legRx2}" y2="${legRy2}" stroke="${o.strokeC}" stroke-width="${legW + 1.6}" stroke-linecap="round"/>
    <line x1="${legLx1}" y1="${legLy1}" x2="${legLx2}" y2="${legLy2}" stroke="${o.fillC}" stroke-width="${legW}" stroke-linecap="round"/>
    <line x1="${legRx1}" y1="${legRy1}" x2="${legRx2}" y2="${legRy2}" stroke="${o.fillC}" stroke-width="${legW}" stroke-linecap="round"/>
    <ellipse cx="${legLx2}" cy="${o.footY}" rx="${legW * 0.6}" ry="2.3" fill="${o.strokeC}"/>
    <ellipse cx="${legRx2}" cy="${o.footY}" rx="${legW * 0.6}" ry="2.3" fill="${o.strokeC}"/>
    <line x1="${armLx1}" y1="${armLy1}" x2="${armLx2}" y2="${armLy2}" stroke="${o.strokeC}" stroke-width="${armW + 1.6}" stroke-linecap="round"/>
    <line x1="${armRx1}" y1="${armRy1}" x2="${armRx2}" y2="${armRy2}" stroke="${o.strokeC}" stroke-width="${armW + 1.6}" stroke-linecap="round"/>
    <line x1="${armLx1}" y1="${armLy1}" x2="${armLx2}" y2="${armLy2}" stroke="${o.fillC}" stroke-width="${armW}" stroke-linecap="round"/>
    <line x1="${armRx1}" y1="${armRy1}" x2="${armRx2}" y2="${armRy2}" stroke="${o.fillC}" stroke-width="${armW}" stroke-linecap="round"/>
    <circle cx="${armLx2}" cy="${armLy2}" r="${armW * 0.6}" fill="${o.strokeC}"/>
    <circle cx="${armRx2}" cy="${armRy2}" r="${armW * 0.6}" fill="${o.strokeC}"/>
    <path d="${torso}" fill="${o.fillC}" stroke="${o.strokeC}" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="${cx - 3.2}" y="${o.headCy + o.headR - 2}" width="6.4" height="6.5" rx="2.2" fill="${o.fillC}" stroke="${o.strokeC}" stroke-width="1"/>
    <circle cx="${cx}" cy="${o.headCy}" r="${o.headR}" fill="${o.fillC}" stroke="${o.strokeC}" stroke-width="1.2"/>
  </svg>`;
}

// 성인 남성: 어깨가 넓고 허리 굴곡이 적은 각진 체형.
function bodyMale(ws) {
  return personSVG({
    cx: 30, ws,
    shoulderY: 20, waistY: 40, hipY: 48, hipBottomY: 54, legBottomY: 82, footY: 84.5,
    viewH: 88, dispW: 44, dispH: 64,
    shoulderBase: 15, shoulderGrow: 5,
    waistBase: 12, waistGrow: 12,
    hipRatio: 0.96,

  });
}

// 성인 여성: 어깨가 좁고 허리가 잘록했다가 엉덩이에서 다시 퍼지는 체형.
function bodyFemale(ws) {

// 소아: 머리 비중이 크고 몸통/팔다리가 짧은 아동 체형 (성별 구분 없이 공용으로 사용).
function bodyChild(ws) {

// 소아면 소아 도안, 아니면 성별(genderClass)에 따라 남성/여성 도안을 고릅니다.
// 성별 정보가 없으면 남성 도안을 기본으로 씁니다.
function bodySVG(widthScale, gender, isChild) {
  if (isChild) return bodyChild(widthScale);
  return genderClass(gender) === 'female' ? bodyFemale(widthScale) : bodyMale(widthScale);
}

function renderBMI(bmi, gender, isChild) {
  const cats = [
    { label: '매우수척', range: 'BMI 17', w: 0.15 },

    { label: '중등도', range: 'BMI 24', w: 0.6 },
    { label: '약간비만', range: 'BMI 26', w: 0.75 },
    { label: '비만', range: 'BMI 29', w: 0.9 },
    { label: '매우비만', range: 'BMI 33~', w: 1.0 }
  ];

  return cats.map((c, i) => {
