<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청춘한의원 - 문진 관리</title>
<style>
:root {
  --brand-1: #2f3b8f;
  --brand-2: #6d4fc9;
  --brand-soft: #eef0fb;
  --ink-900: #1e2233;
  --ink-700: #454b5f;
  --ink-500: #757c92;
  --ink-300: #aeb3c4;
  --line: #e4e6f0;
  --line-soft: #eef0f7;
  --bg: #f4f5fa;
  --surface: #ffffff;
  --danger: #d64559;
  --danger-soft: #fdeef0;
  --success: #1f9d63;
  --warn: #a9750f;
  --warn-soft: #fdf3e2;
  --warn-line: #f2e3ba;
  --shadow-sm: 0 1px 3px rgba(24, 28, 56, 0.05);
  --shadow-md: 0 10px 28px rgba(28, 32, 64, 0.08);
  --shadow-lg: 0 18px 44px rgba(28, 32, 64, 0.14);
  --radius-lg: 18px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --c-teal: #0d9488;
  --c-teal-soft: #e1f6f2;
  --c-pink: #db2777;
  --c-pink-soft: #fce7f3;
  --c-blue: #2563eb;
  --c-blue-soft: #dbeafe;
  --c-orange: #ea580c;
  --c-orange-soft: #ffedd5;
  --c-violet: #7c3aed;
  --c-violet-soft: #f1e9fd;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; background: var(--bg); color: var(--ink-900); -webkit-font-smoothing: antialiased; }

/* ===== 대시보드 ===== */
.topbar { background: var(--surface); border-bottom: 4px solid transparent; border-image: linear-gradient(90deg, var(--c-violet), var(--c-pink), var(--c-orange), var(--c-teal), var(--c-blue)) 1; padding: 10px 22px; display: flex; justify-content: space-between; align-items: center; height: 52px; box-shadow: var(--shadow-md); }
.topbar .brand { font-weight: 700; font-size: 15px; color: var(--ink-900); letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.topbar .brand span { color: var(--brand-2); }
.topbar .brand .brand-logo { height: 20px; width: auto; }
.topbar .right { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--ink-500); }
.topbar button { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #fff; border: none; padding: 7px 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 12.5px; font-weight: 700; transition: box-shadow .15s; box-shadow: var(--shadow-sm); }
.topbar button:hover { box-shadow: var(--shadow-md); }

.layout { display: flex; height: calc(100vh - 52px); }
.sidebar { width: 300px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.sidebar-hdr { padding: 12px; border-bottom: 1px solid var(--line-soft); }
.sidebar-hdr input { width: 100%; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); font-size: 13px; }
.sidebar-hdr input:focus { outline: none; border-color: var(--brand-2); }
.p-list { flex: 1; overflow-y: auto; }
.p-item { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); cursor: pointer; transition: background .1s; display: flex; gap: 10px; align-items: flex-start; }
.p-item:hover { background: #f7f8fd; }
.p-item:hover .p-del { opacity: 1; }
.p-item.active { background: var(--brand-soft); border-left: 4px solid var(--c-violet); padding-left: 12px; }
.p-item .p-num { font-size: 11px; font-weight: 700; color: var(--ink-300); min-width: 18px; flex-shrink: 0; margin-top: 1px; }
.p-item .p-body { flex: 1; min-width: 0; }
.p-item .nm { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px; color: var(--ink-900); }
.p-item .nm .gender-tag { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: var(--line-soft); color: var(--ink-500); }
.p-item .nm .gender-tag.male, .patient-card .name .gender-tag.male { background: var(--c-blue-soft); color: var(--c-blue); }
.p-item .nm .gender-tag.female, .patient-card .name .gender-tag.female { background: var(--c-pink-soft); color: var(--c-pink); }
.p-item .inf { font-size: 11.5px; color: var(--ink-500); margin-top: 3px; }
.p-item .tm { font-size: 10.5px; color: var(--ink-300); margin-top: 2px; }
.p-item .p-del { flex-shrink: 0; opacity: 0; transition: opacity .15s; background: none; border: none; color: var(--ink-300); font-size: 15px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.p-item .p-del:hover { color: #fff; background: var(--danger); }
.empty-list { padding: 30px 16px; text-align: center; color: var(--ink-300); font-size: 13px; }

.detail { flex: 1; overflow-y: auto; padding: 26px 34px; }
.detail-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--ink-300); font-size: 14px; }

.patient-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 22px 34px; align-items: center; box-shadow: var(--shadow-sm); }
.patient-card .name { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.patient-card .name .gender-tag { font-size: 11px; font-weight: 700; margin-left: 8px; padding: 2px 9px; border-radius: 10px; background: var(--brand-soft); color: var(--brand-2); vertical-align: middle; }
.patient-card { border-top: 4px solid var(--c-violet); }
.patient-card .field { font-size: 12px; color: var(--ink-500); }
.patient-card .field b { display: block; font-size: 14px; color: var(--ink-900); font-weight: 700; margin-top: 2px; }
.patient-card .field .vital-hint { font-size: 10px; color: var(--c-orange); font-weight: 600; }
.patient-card .field b.vital-edit { display: flex; align-items: center; gap: 4px; }
.vital-input { width: 56px; border: 1.5px solid var(--c-orange-soft); background: var(--c-orange-soft); border-radius: 6px; padding: 3px 6px; font-size: 13px; font-weight: 700; color: var(--ink-900); font-family: inherit; }
.vital-input:focus { outline: none; border-color: var(--c-orange); background: var(--surface); }
.patient-card .copy-btn { margin-left: auto; background: var(--brand-soft); color: var(--brand-1); border: none; padding: 9px 16px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 700; cursor: pointer; transition: background .15s; }
.patient-card .copy-btn:hover { background: #e2e5f9; }

.bmi-section { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c-teal); border-radius: var(--radius-md); padding: 16px 20px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.bmi-section h3 { font-size: 13px; color: var(--c-teal); margin-bottom: 10px; font-weight: 700; }
.bmi-bar { display: flex; gap: 8px; align-items: flex-end; justify-content: center; flex-wrap: wrap; }
.bmi-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 8px 6px; border-radius: var(--radius-sm); min-width: 72px; }
.bmi-circle { width: 66px; height: 66px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; border: 2px solid var(--line); transition: all .15s; }
.bmi-circle-active { background: var(--brand-soft); border: 3px solid var(--brand-1); box-shadow: 0 0 0 3px rgba(47,59,143,0.14); }
.bmi-item .bmi-label { font-size: 11px; color: var(--ink-500); white-space: nowrap; font-weight: 600; }
.bmi-item .bmi-val { font-size: 10px; color: var(--ink-300); }
.bmi-item.active .bmi-label { color: var(--brand-1); }
.bmi-item.active .bmi-val { color: var(--brand-1); font-weight: 600; }
.bmi-note { font-size: 11.5px; color: var(--ink-300); text-align: center; margin-top: 8px; }

/* 형색성정: 성향/면색/붉은기/기타/안진 - 모두 원장님이 진료 중 직접 판단해 표시 (자동 아님) */
.hss-section { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c-violet); border-radius: var(--radius-md); padding: 16px 20px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.hss-section h3 { font-size: 13px; color: var(--c-violet); margin-bottom: 4px; font-weight: 700; }
.hss-section .sub { font-size: 11.5px; color: var(--ink-300); margin-bottom: 12px; }
.hss-two { display: flex; gap: 28px; }
.hss-left { flex: 1; min-width: 0; }
.hss-right { flex: 1.15; min-width: 0; }
.hss-sub { font-size: 11.5px; color: var(--ink-900); font-weight: 700; margin: 12px 0 6px; }
.hss-sub:first-child { margin-top: 0; }
.dot-scale { display: flex; align-items: center; gap: 6px; }
.dot-scale .end-label { font-size: 11.5px; color: var(--ink-500); font-weight: 600; min-width: 30px; }
.dot-scale .end-label.right { text-align: right; }
.dot-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; transition: all .15s; flex-shrink: 0; }
.dot-btn:hover { border-color: var(--c-violet); }
.dot-btn.active { background: var(--c-violet); border-color: var(--c-violet); }
.tag-group { display: flex; gap: 6px; flex-wrap: wrap; }
.tag-btn { padding: 5px 12px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); font-size: 11.5px; cursor: pointer; background: var(--surface); color: var(--ink-900); transition: all .15s; }
.tag-btn:hover { border-color: var(--c-violet); }
.tag-btn.active { background: var(--c-violet); color: #fff; border-color: var(--c-violet); }
.anjin-title { font-size: 11.5px; color: var(--ink-900); font-weight: 700; margin-bottom: 8px; }
.anjin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; }
.anjin-item { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line-soft); font-size: 11.5px; gap: 8px; }
.anjin-item .aj-name { color: var(--ink-700); }
.star-group { display: flex; gap: 1px; flex-shrink: 0; }
.star-btn { font-size: 16px; color: var(--line); cursor: pointer; line-height: 1; transition: color .1s; }
.star-btn.on { color: #f0b93d; }
.star-btn:hover { color: #f0b93d; }

.symptom-box { background: var(--warn-soft); border: 1px solid var(--warn-line); border-left: 4px solid var(--warn); border-radius: var(--radius-md); padding: 16px 20px; margin-bottom: 18px; }
.symptom-box h3 { font-size: 13px; color: var(--warn); margin-bottom: 8px; font-weight: 700; }
.symptom-box pre { white-space: pre-wrap; font-family: inherit; font-size: 13.5px; line-height: 1.7; color: #6b4f16; }

/* 두 칸 레이아웃: 왼쪽 문진 내용 / 오른쪽 주증상·메모 */
.two-col { display: flex; gap: 16px; align-items: flex-start; }
.col-main { flex: 1; min-width: 0; }
.col-side { width: 320px; flex-shrink: 0; }

.side-box { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c-blue); border-radius: var(--radius-md); padding: 16px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.side-box.cc { border-top-color: var(--c-orange); }
.side-box.memo { border-top-color: var(--c-teal); }
.side-box.ai { border-top-color: var(--c-violet); }
.side-box.presc { border-top-color: var(--c-pink); }
.side-box-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.side-box-hdr h3 { font-size: 13px; color: var(--ink-900); font-weight: 700; }
.side-btn { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #fff; border: none; padding: 5px 12px; border-radius: var(--radius-sm); font-size: 11.5px; font-weight: 700; cursor: pointer; transition: box-shadow .15s; }
.side-btn:hover { box-shadow: var(--shadow-sm); }
.side-btn.ghost { background: var(--brand-soft); color: var(--brand-1); }
.side-btn.ghost:hover { background: #e2e5f9; }

/* AI 처방 추천 */
.ai-run-btn { width: 100%; background: linear-gradient(135deg, var(--c-violet), var(--c-pink)); color: #fff; border: none; padding: 11px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-sm); transition: box-shadow .15s; }
.ai-run-btn:hover { box-shadow: var(--shadow-md); }
.ai-run-btn:disabled { opacity: .6; cursor: not-allowed; }
.ai-status { font-size: 12px; color: var(--ink-500); margin-top: 8px; white-space: pre-wrap; word-break: break-all; }
.ai-status.err { color: var(--danger); font-weight: 600; }
.ai-note { font-size: 11px; color: var(--ink-300); margin-top: 6px; line-height: 1.5; }
.ai-candidate { border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 10px; cursor: pointer; transition: border-color .15s, background .15s; }
.ai-candidate:hover { border-color: var(--brand-2); background: #fbfbff; }
.ai-cand-top { display: flex; align-items: baseline; gap: 8px; }
.ai-cand-rank { font-size: 10.5px; font-weight: 700; color: #fff; background: var(--ink-300); border-radius: 8px; padding: 1px 7px; flex-shrink: 0; }
.ai-candidate:nth-child(1) .ai-cand-rank { background: var(--brand-1); }
.ai-cand-name { font-size: 13px; font-weight: 700; color: var(--ink-900); flex: 1; }
.ai-cand-fit { font-size: 12.5px; font-weight: 700; color: var(--brand-1); }
.ai-fit-bar { height: 5px; background: var(--line-soft); border-radius: 4px; margin: 6px 0; overflow: hidden; }
.ai-fit-fill { height: 100%; background: linear-gradient(90deg, var(--brand-1), var(--brand-2)); border-radius: 4px; }
.ai-cand-note { font-size: 11.5px; color: var(--ink-500); }
.ai-toggle { font-size: 10.5px; color: var(--brand-2); margin-top: 6px; text-decoration: underline; }
.ai-reasons { font-size: 11px; margin-top: 6px; line-height: 1.6; }
.ai-reasons .m { color: var(--success); }
.ai-reasons .x { color: var(--ink-500); }
.ai-questions { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.ai-questions h4 { font-size: 12px; color: var(--ink-900); margin-bottom: 6px; }
.ai-questions ul { padding-left: 18px; }
.ai-questions li { font-size: 11.5px; color: var(--ink-700); margin-bottom: 8px; line-height: 1.5; }
.ai-q-reason { font-size: 10.5px; color: var(--ink-300); margin-top: 2px; }

.cc-card { border: 1px solid var(--line-soft); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 12px; }
.cc-card:last-child { margin-bottom: 0; }
.cc-remove { text-align: right; font-size: 10.5px; color: var(--danger); cursor: pointer; padding: 4px 8px 0; }
.cc-row { display: flex; align-items: stretch; border-top: 1px solid var(--line-soft); }
.cc-row:first-child { border-top: none; }
.cc-row.shaded { background: #f8f8fc; }
.cc-label { width: 60px; flex-shrink: 0; background: var(--ink-500); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 4px; }
.cc-label.cc-cc { background: var(--c-violet); }
.cc-label.cc-os { background: var(--c-teal); }
.cc-label.cc-symptom { background: var(--c-orange); }
.cc-label.cc-worse { background: var(--danger); }
.cc-label.cc-better { background: var(--success); }
.cc-input { flex: 1; border: none; background: transparent; font-size: 12.5px; padding: 8px 10px; resize: vertical; min-height: 34px; font-family: inherit; color: var(--ink-900); }
.cc-input:focus { outline: none; background: #fbfbff; }

.memo-textarea { width: 100%; border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 10px; font-size: 12.5px; resize: vertical; min-height: 90px; font-family: inherit; color: var(--ink-900); }
.memo-textarea:focus { outline: none; border-color: var(--brand-2); }
.memo-textarea.big { min-height: 320px; }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 20px; }
.cat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
.cat-card .cat-hdr { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); color: #fff; font-size: 12.5px; font-weight: 700; padding: 9px 16px; }
.cat-card:nth-child(4n+2) .cat-hdr { background: linear-gradient(135deg, var(--c-teal), #16a34a); }
.cat-card:nth-child(4n+3) .cat-hdr { background: linear-gradient(135deg, var(--c-orange), var(--c-pink)); }
.cat-card:nth-child(4n+4) .cat-hdr { background: linear-gradient(135deg, var(--c-blue), var(--c-violet)); }
.cat-card .cat-body { padding: 12px 16px; }
.qa-row { font-size: 13px; line-height: 1.6; padding: 6px 0; border-bottom: 1px dashed var(--line-soft); }
.qa-row:last-child { border-bottom: none; }
.qa-row .q { color: var(--ink-500); }
.qa-row .a { color: var(--ink-900); font-weight: 600; }
.qa-sub { font-size: 12px; color: var(--ink-500); padding: 2px 0 2px 12px; }
.qa-sub b { color: var(--ink-700); font-weight: 600; }

/* 문진 답변 수정 UI */
.save-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.save-bar button { background: linear-gradient(135deg, var(--c-violet), var(--c-pink)); color: #fff; border: none; padding: 11px 22px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-md); transition: transform .1s, box-shadow .15s; }
.save-bar button:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.save-bar.top { padding: 12px 14px; background: var(--brand-soft); border-radius: var(--radius-md); }
.save-status { font-size: 12px; color: var(--ink-500); }
.save-status.ok { color: var(--success); font-weight: 600; }
.save-status.err { color: var(--danger); font-weight: 600; }
.edit-opts { display: flex; flex-wrap: wrap; gap: 3px 14px; margin: 3px 0 2px; }
.edit-opt, .edit-chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-900); cursor: pointer; }
.edit-opt input, .edit-chk input { width: 15px; height: 15px; accent-color: var(--brand-1); cursor: pointer; margin: 0; }
.qa-sub-block { margin: 2px 0 8px 14px; padding-left: 10px; border-left: 2px solid var(--line-soft); }
.qa-sub-title { font-size: 11.5px; color: var(--brand-2); font-weight: 600; margin: 4px 0 2px; }

.raw-toggle { font-size: 12px; color: var(--ink-300); cursor: pointer; margin-bottom: 8px; display: inline-block; }
.raw-box { display: none; background: var(--line-soft); border-radius: var(--radius-sm); padding: 12px; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--ink-500); white-space: pre-wrap; word-break: break-all; margin-bottom: 20px; }

.status-line { font-size: 12px; color: var(--ink-300); padding: 0 22px; }

@media (max-width: 1000px) {
  .two-col { flex-direction: column; }
  .col-side { width: 100%; }
  .hss-two { flex-direction: column; gap: 4px; }
  .anjin-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="dash">
  <div class="topbar">
    <div class="brand"><img class="brand-logo" src="assets/청춘한의원_로고-01.png" alt="청춘한의원"> <span>문진 관리</span></div>
    <div class="right">
      <span id="last-updated"></span>
      <button onclick="loadData()">새로고침</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-hdr">
        <input type="text" id="search" placeholder="이름 또는 전화번호 검색" oninput="renderList()">
      </div>
      <div class="p-list" id="p-list"></div>
    </div>
    <div class="detail" id="detail">
      <div class="detail-empty">왼쪽 목록에서 환자를 선택해주세요.</div>
    </div>
  </div>
</div>

<script src="questions.js"></script>
<script>
// docs/index.html 의 GAS_URL 과 동일한 주소를 사용합니다.
const GAS_URL = "https://script.google.com/macros/s/AKfycbzp_jMJK3Bq1mfwqa39mYQJdgIdKWkkIrrXaifMD3JY8QvzeWjyIlrpVwG-m7b70-RM/exec";

// 원장님 혼자만 쓰는 페이지라 비밀번호 입력 없이 바로 불러옵니다.
// Code.gs의 ADMIN_KEY와 같은 값이며, 이 값은 google-apps-script/Code.gs에도
// 그대로 적혀 있어(그 파일이 이미 공개 저장소에 있음) 별도로 숨겨도 의미가 없습니다.
const adminKey = '3133';
let records = [];
let selectedIdx = null;

// 문진 답변 수정용 (questions.js 의 Q/visibleQ/buildSummary 가 참조하는 전역 변수).
// 환자를 새로 선택했을 때만 r.raw로 채우고, 그 이후 같은 환자를 다시 그릴 때는
// (원장님이 클릭해서 고친 내용이 사라지지 않도록) 이미 채워진 값을 그대로 씁니다.
let answers = {};
let selectedGender = null;
let editingRowNum = null;
// 현재 열린 환자가 실제 문진 답변 수정 UI(라디오/체크박스)를 보여주고 있는지 여부.
// true일 때만 통합 저장 버튼이 raw/summary도 함께 저장합니다.
let hasEditableAnswers = false;

// 환자가 문진에서 적어낸 키/몸무게를 원장님이 직접 고칠 수 있게 하는 값.
// (일부러 체중을 속여 적는 환자가 있어, 진료 중 실측치로 바로 잡을 수 있어야 함)
// editingRowNum이 바뀔 때만 원본 값으로 초기화합니다.
let editedVitals = { height: '', weight: '' };

// 주증상(CC)/진료메모/처방메모 - 원장님이 진료 중 직접 채워 넣는 항목.
// editingRowNum이 바뀔 때(환자를 새로 열 때)만 초기화합니다.
let doctorNotes = { cc: [], memo: '', prescription: '', tendency: null, myunsaek: null, bulgeun: null, gita: [], anjin: {} };

// AI 처방 추천 결과(마지막으로 받은 것) - "근거 보기"/"처방메모에 담기" 버튼에서 참조합니다.
let lastAiResult = null;

loadData();

// 구글시트가 "01090261075" 같은 전화번호를 숫자로 자동 인식해서 맨 앞 0이 사라지는 경우가 있어
// (이때 r.phone은 문자열이 아니라 숫자가 되어 .includes() 검색도 깨집니다), 불러온 직후 복구합니다.
function formatPhone(v) {
  if (v === undefined || v === null || v === '') return '';
  let s = String(v).trim();
  if (/^[1-9][0-9]{8,9}$/.test(s)) s = '0' + s;
  return s;
}
function normalizeRecord(r) { return Object.assign({}, r, { phone: formatPhone(r.phone) }); }

function genderClass(g) {
  if (!g) return '';
  if (g.indexOf('남') === 0) return 'male';
  if (g.indexOf('여') === 0) return 'female';
  return '';
}

async function loadData() {
  const statusEl = document.getElementById('last-updated');
  if (statusEl && records.length === 0) statusEl.textContent = '불러오는 중...';
  try {
    const res = await fetch(GAS_URL + '?key=' + encodeURIComponent(adminKey));
    const data = await res.json();
    if (Array.isArray(data)) {
      records = data.map(normalizeRecord);
      renderList();
      if (selectedIdx !== null) renderDetail(selectedIdx);
      updateTimestamp();
    } else if (statusEl) {
      statusEl.textContent = '서버 응답에 문제가 있습니다.';
    }
  } catch (e) {
    if (statusEl) statusEl.textContent = '서버에 연결하지 못했습니다. 새로고침을 눌러주세요.';
  }
}

function updateTimestamp() {
  const now = new Date();
  document.getElementById('last-updated').textContent =
    '마지막 새로고침 ' + now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

function renderList() {
  const kw = (document.getElementById('search').value || '').trim();
  const list = document.getElementById('p-list');
  const filtered = records
    .map((r, i) => ({ r, i }))
    .filter(({ r }) => !kw || (r.name || '').includes(kw) || (r.phone || '').includes(kw));

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-list">아직 접수된 문진이 없습니다.</div>';
    return;
  }

  // records는 최신 제출이 맨 앞(index 0)에 오도록 정렬되어 있으므로,
  // 가장 오래된 접수가 1번이 되도록 뒤에서부터 번호를 매깁니다 (목록에 보이는 순서 자체는 최신순 그대로 유지).
  list.innerHTML = filtered.map(({ r, i }) => {
    const dt = r.submittedAt ? new Date(r.submittedAt) : null;
    const dtText = dt ? dt.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
    const genderTag = r.gender ? `<span class="gender-tag ${genderClass(r.gender)}">${r.gender}</span>` : '';
    const num = records.length - i;
    return `<div class="p-item${i === selectedIdx ? ' active' : ''}" onclick="renderDetail(${i})">
      <span class="p-num">${num}</span>
      <div class="p-body">
        <div class="nm">${esc(r.name || '(이름없음)')} ${genderTag}</div>
        <div class="inf">${esc(r.phone || '')}</div>
        <div class="tm">${dtText}</div>
      </div>
      <button class="p-del" title="삭제" onclick="event.stopPropagation(); deleteRecord(${r.rowNum}, '${escJsAttr(r.name || '(이름없음)')}')">&#10005;</button>
    </div>`;
  }).join('');
}

// 관리자페이지에서 잘못 접수된 문진(테스트 접수, 중복 등)을 완전히 삭제합니다.
// 구글시트에서 실제로 행이 지워지는 되돌릴 수 없는 작업이라, 클릭할 때마다 반드시 확인을 받습니다.
function deleteRecord(rowNum, name) {
  if (!confirm(`${name}님의 문진 기록을 정말 삭제하시겠습니까?\n\n구글시트에서 완전히 삭제되며, 되돌릴 수 없습니다.`)) return;

  const payload = { action: 'delete', key: adminKey, rowNum: rowNum };
  fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) })
    .then(res => res.json())
    .then(data => {
      if (!data || data.status !== 'ok') {
        alert((data && data.message) || '삭제에 실패했습니다.');
        return;
      }
      // rowNum이 밀려서 다른 환자들의 행 번호도 바뀌므로, 서버에서 다시 불러와 목록을 맞춥니다.
      if (selectedIdx !== null && records[selectedIdx] && records[selectedIdx].rowNum === rowNum) {
        selectedIdx = null;
        document.getElementById('detail').innerHTML = '<div class="detail-empty">왼쪽 목록에서 환자를 선택해주세요.</div>';
      }
      loadData();
    })
    .catch(() => {
      alert('서버에 연결하지 못했습니다. 네트워크를 확인해주세요.');
    });
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ===== BMI 자동 계산 및 체형 그림 =====
function calcBMI(h, w) {
  h = parseFloat(h); w = parseFloat(w);
  if (!h || !w) return null;
  return w / ((h / 100) * (h / 100));
}

function getBMICategory(bmi) {
  if (!bmi) return -1;
  if (bmi < 18.5) return 0;
  if (bmi < 20) return 1;
  if (bmi < 23) return 2;
  if (bmi < 25) return 3;
  if (bmi < 27.5) return 4;
  if (bmi < 30) return 5;
  return 6;
}

function bodySVG(widthScale) {
  // widthScale 0(매우수척) ~ 1(매우비만) 에 따라 어깨/허리/엉덩이 너비가 커지는
  // 사람 실루엣(머리/팔/몸통/다리)을 그립니다.
  const cx = 30;
  const shoulderW = 13 + widthScale * 7;
  const waistW = 9 + widthScale * 15;
  const hipW = waistW * 0.92;
  const legGap = 3;
  const shoulderY = 24, waistY = 44, hipY = 52, legBottomY = 76;
  const legW = (hipW - legGap) / 2;
  const foot = Math.min(3, legW * 0.55);
  const armW = 4.5 + widthScale * 3;

  const torso = `
    M ${cx - shoulderW} ${shoulderY}
    Q ${cx} ${shoulderY - 7} ${cx + shoulderW} ${shoulderY}
    C ${cx + shoulderW + 3} ${shoulderY + 7}, ${cx + waistW + 2} ${waistY - 10}, ${cx + waistW} ${waistY}
    C ${cx + waistW - 1} ${waistY + 5}, ${cx + hipW} ${hipY - 5}, ${cx + hipW} ${hipY}
    L ${cx + legGap / 2 + legW} ${legBottomY - foot}
    Q ${cx + legGap / 2 + legW} ${legBottomY}, ${cx + legGap / 2 + legW - foot} ${legBottomY}
    L ${cx + legGap / 2 + 1} ${legBottomY}
    L ${cx + legGap / 2} ${hipY + 6}
    L ${cx - legGap / 2} ${hipY + 6}
    L ${cx - legGap / 2 - 1} ${legBottomY}
    L ${cx - legGap / 2 - legW + foot} ${legBottomY}
    Q ${cx - legGap / 2 - legW} ${legBottomY}, ${cx - legGap / 2 - legW} ${legBottomY - foot}
    L ${cx - hipW} ${hipY}
    C ${cx - hipW} ${hipY - 5}, ${cx - waistW + 1} ${waistY + 5}, ${cx - waistW} ${waistY}
    C ${cx - waistW - 2} ${waistY - 10}, ${cx - shoulderW - 3} ${shoulderY + 7}, ${cx - shoulderW} ${shoulderY}
    Z`;

  return `<svg viewBox="0 0 60 80" width="46" height="60">
    <line x1="${cx - shoulderW + 3}" y1="${shoulderY + 1}" x2="${cx - shoulderW - 1}" y2="${waistY + 2}" stroke="#9fb0c3" stroke-width="${armW + 2}" stroke-linecap="round"/>
    <line x1="${cx + shoulderW - 3}" y1="${shoulderY + 1}" x2="${cx + shoulderW + 1}" y2="${waistY + 2}" stroke="#9fb0c3" stroke-width="${armW + 2}" stroke-linecap="round"/>
    <line x1="${cx - shoulderW + 3}" y1="${shoulderY + 1}" x2="${cx - shoulderW - 1}" y2="${waistY + 2}" stroke="#c3d2e3" stroke-width="${armW}" stroke-linecap="round"/>
    <line x1="${cx + shoulderW - 3}" y1="${shoulderY + 1}" x2="${cx + shoulderW + 1}" y2="${waistY + 2}" stroke="#c3d2e3" stroke-width="${armW}" stroke-linecap="round"/>
    <path d="${torso}" fill="#c3d2e3" stroke="#9fb0c3" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="${cx}" cy="11" r="8.5" fill="#c3d2e3" stroke="#9fb0c3" stroke-width="1.2"/>
  </svg>`;
}

function renderBMI(bmi) {
  const cats = [
    { label: '매우수척', range: 'BMI 17', w: 0.15 },
    { label: '수척', range: 'BMI 19', w: 0.3 },
    { label: '약간수척', range: 'BMI 22', w: 0.45 },
    { label: '중등도', range: 'BMI 24', w: 0.6 },
    { label: '약간비만', range: 'BMI 26', w: 0.75 },
    { label: '비만', range: 'BMI 29', w: 0.9 },
    { label: '매우비만', range: 'BMI 33~', w: 1.0 }
  ];
  const active = getBMICategory(bmi);
  return cats.map((c, i) => {
    const act = i === active ? ' active' : '';
    return `<div class="bmi-item${act}">
      <div class="bmi-circle${act ? ' bmi-circle-active' : ''}">${bodySVG(c.w)}</div>
      <div class="bmi-label">${c.label}</div>
      <div class="bmi-val">${c.range}</div>
    </div>`;
  }).join('');
}

// 키/몸무게 입력칸이 바뀔 때마다 호출 - BMI만 다시 그리고(#bmi-body),
// 값 자체는 저장 버튼을 눌러야 구글시트에 반영됩니다.
function updateVital(field, val) {
  editedVitals[field] = val;
  const el = document.getElementById('bmi-body');
  if (el) el.innerHTML = renderBMIBody();
}

function renderBMIBody() {
  const bmi = calcBMI(editedVitals.height, editedVitals.weight);
  return `<div class="bmi-bar">${renderBMI(bmi)}</div>` +
    (bmi ? `<div class="bmi-note">BMI ${bmi.toFixed(1)}</div>` : `<div class="bmi-note">키/몸무게 정보가 없어 계산할 수 없습니다.</div>`);
}

// ===== 형색성정: 성향/면색/붉은기/기타/안진 (모두 원장님이 진료 중 직접 판단해 표시, 자동 아님) =====
// 주증상/메모와 함께 doctorNotes에 담겨 "저장" 버튼을 누르면 구글시트에 저장됩니다.
const ANJIN_ITEMS = [
  '상완 이두근 압통', '상완 삼두근 압통',
  '심하 좁은부위 압통', '심하 넓은부위 압통',
  '우 협하 압통', '좌 협하 압통',
  '늑골들림', '복직근 경결 압통',
  '우 제하 압통', '좌 제하 압통',
  '복피 찰과 발적', '비복근 압통',
  '경골상 함요 부종',
  '장요근 압통', '능형근·기립근 압통'
];

function refreshHSS() {
  const el = document.getElementById('hss-body');
  if (el) el.innerHTML = renderHSSBody();
}

function setDotField(field, idx) {
  doctorNotes[field] = doctorNotes[field] === idx ? null : idx;
  refreshHSS();
}
function setTagField(field, val) {
  doctorNotes[field] = doctorNotes[field] === val ? null : val;
  refreshHSS();
}
function toggleGita(val) {
  const i = doctorNotes.gita.indexOf(val);
  if (i > -1) doctorNotes.gita.splice(i, 1);
  else doctorNotes.gita.push(val);
  refreshHSS();
}
function setAnjinStar(name, star) {
  doctorNotes.anjin[name] = doctorNotes.anjin[name] === star ? 0 : star;
  refreshHSS();
}

function renderDotScale(field, leftLabel, rightLabel) {
  const cur = doctorNotes[field];
  let h = `<span class="end-label">${leftLabel}</span>`;
  for (let i = 0; i < 7; i++) {
    const act = cur === i ? ' active' : '';
    h += `<div class="dot-btn${act}" onclick="setDotField('${field}',${i})"></div>`;
  }
  h += `<span class="end-label right">${rightLabel}</span>`;
  return h;
}

function renderHSSBody() {
  let h = '<div class="hss-left">';
  h += `<div class="hss-sub">· 성향</div><div class="dot-scale">${renderDotScale('tendency', '양적', '음적')}</div>`;
  h += `<div class="hss-sub">· 면색</div><div class="dot-scale">${renderDotScale('myunsaek', '짙은편', '옅은편')}</div>`;

  h += `<div class="hss-sub">· 붉은기</div><div class="tag-group">`;
  ['약간그렇다', '그렇다', '매우그렇다'].forEach(t => {
    const act = doctorNotes.bulgeun === t ? ' active' : '';
    h += `<div class="tag-btn${act}" onclick="setTagField('bulgeun','${t}')">${t}</div>`;
  });
  h += `</div>`;

  h += `<div class="hss-sub">· 기타(선택)</div><div class="tag-group">`;
  ['미간주름', '입술건조', '안구황색침착'].forEach(t => {
    const act = doctorNotes.gita.includes(t) ? ' active' : '';
    h += `<div class="tag-btn${act}" onclick="toggleGita('${t}')">${t}</div>`;
  });
  h += `</div></div>`; // hss-left

  h += `<div class="hss-right"><div class="anjin-title">· 안진</div><div class="anjin-grid">`;
  ANJIN_ITEMS.forEach(name => {
    const stars = doctorNotes.anjin[name] || 0;
    h += `<div class="anjin-item"><span class="aj-name">${esc(name)}</span><div class="star-group">`;
    for (let s = 1; s <= 3; s++) {
      const on = s <= stars ? ' on' : '';
      h += `<span class="star-btn${on}" onclick="setAnjinStar('${escJsAttr(name)}',${s})">&#9733;</span>`;
    }
    h += `</div></div>`;
  });
  h += `</div></div>`; // hss-right
  return h;
}

function renderHSS() {
  return `<div class="hss-section">
    <h3>형색성정</h3>
    <div class="sub">자동 계산이 아니라, 원장님이 진료 중 직접 판단해 표시하는 항목입니다.</div>
    <div class="hss-two" id="hss-body">${renderHSSBody()}</div>
  </div>`;
}

// ===== 문진 답변 수정 (환자가 잘못 표현한 부분을 원장이 직접 고칠 수 있도록) =====
// questions.js 의 Q / visibleQ() / buildSummary() 를 그대로 사용하고, 전역 answers/selectedGender 를
// 현재 열어본 환자의 답변으로 채운 뒤 실제 라디오버튼/체크박스로 그려줍니다.

// 옵션 문자열을 onclick="..." 안의 JS 문자열로 안전하게 넣기 위한 이스케이프 (index.html의 esc()와 동일)
function escJsAttr(s) { return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function isEditSelected(qId, opt, type) {
  if (type === 'single') return answers[qId] === opt;
  return (answers[qId] || []).includes(opt);
}

// docs/index.html 의 pick()과 동일한 선택/토글 로직
function editPick(qId, val, type) {
  val = val.replace(/\\'/g, "'");
  const isNA = val === '해당없음' || val === '해당 없음';
  if (type === 'single') {
    if (answers[qId] === val) delete answers[qId];
    else answers[qId] = val;
  } else {
    if (!answers[qId]) answers[qId] = [];
    const i = answers[qId].indexOf(val);
    if (i > -1) {
      answers[qId].splice(i, 1);
    } else if (isNA) {
      answers[qId] = [val];
    } else {
      answers[qId] = answers[qId].filter(v => v !== '해당없음' && v !== '해당 없음');
      answers[qId].push(val);
    }
    if (answers[qId].length === 0) delete answers[qId];
  }
  renderDetail(selectedIdx);
}

function editToggleEmo(itemId) {
  answers[itemId] = !answers[itemId];
  if (!answers[itemId]) delete answers[itemId];
  renderDetail(selectedIdx);
}

function renderSubQuestionRow(sq) {
  const inputType = sq.type === 'multi' ? 'checkbox' : 'radio';
  let h = '';
  if (sq.title) h += `<div class="qa-sub-title">${esc(sq.title)}</div>`;
  h += `<div class="edit-opts">`;
  sq.opts.forEach(o => {
    const checked = isEditSelected(sq.id, o, sq.type);
    h += `<label class="edit-opt"><input type="${inputType}" name="edit_${sq.id}" ${checked ? 'checked' : ''} onclick="editPick('${sq.id}','${escJsAttr(o)}','${sq.type}')"> ${esc(o)}</label>`;
  });
  h += `</div>`;
  return h;
}

function renderQuestionRow(q) {
  if (q.type === 'emotion') {
    let h = `<div class="qa-row"><span class="q">${esc(q.title)}</span></div><div class="edit-opts">`;
    q.groups.forEach(g => g.items.forEach(it => {
      const checked = answers[it.id] === true;
      h += `<label class="edit-chk"><input type="checkbox" ${checked ? 'checked' : ''} onclick="editToggleEmo('${it.id}')"> ${esc(it.text)}</label>`;
    }));
    h += `</div>`;
    return h;
  }

  const inputType = q.type === 'multi' ? 'checkbox' : 'radio';
  let h = `<div class="qa-row"><span class="q">${esc(q.title)}</span></div><div class="edit-opts">`;
  q.opts.forEach(o => {
    const checked = isEditSelected(q.id, o, q.type);
    h += `<label class="edit-opt"><input type="${inputType}" name="edit_${q.id}" ${checked ? 'checked' : ''} onclick="editPick('${q.id}','${escJsAttr(o)}','${q.type}')"> ${esc(o)}</label>`;
  });
  h += `</div>`;

  if (q.sub) {
    const val = answers[q.id];
    const chosen = Array.isArray(val) ? val : (val !== undefined ? [val] : []);
    chosen.forEach(v => {
      if (q.sub[v]) {
        h += `<div class="qa-sub-block">`;
        q.sub[v].forEach(sq => { h += renderSubQuestionRow(sq); });
        h += `</div>`;
      }
    });
  }
  return h;
}

// 카테고리 카드 중 하나를 맨 앞으로 옮깁니다 (예: 감정을 형색성정 바로 다음, 문진 카드 중 맨 앞에 배치).
function moveCatToFront(cats, name) {
  const idx = cats.findIndex(c => c.name === name);
  if (idx > 0) cats.unshift(cats.splice(idx, 1)[0]);
  return cats;
}

function buildEditableCats() {
  const cats = [];
  let cur = null;
  visibleQ().forEach(q => {
    if (q.type === 'symptom_entry') return;
    if (!cur || cur.name !== q.cat) { cur = { name: q.cat, rows: [] }; cats.push(cur); }
    cur.rows.push(renderQuestionRow(q));
  });
  return moveCatToFront(cats, '감정');
}

// 문진 답변 수정(raw/summary)과 형색성정·주증상·메모(notes)를 한 번에 저장합니다.
// 구글시트에서는 서로 다른 칸이라 따로 저장돼야 하지만, 원장님 입장에서는 버튼 하나면 충분합니다.
// 저장 버튼은 사이드 패널 위/아래 두 곳에 있어, 상태 메시지도 둘 다(.save-status) 갱신합니다.
function setSaveStatus(text, cls) {
  document.querySelectorAll('.save-status').forEach(el => { el.textContent = text; el.className = 'save-status' + (cls ? ' ' + cls : ''); });
}

function saveAll(rowNum) {
  setSaveStatus('저장 중...', '');
  const payload = {
    action: 'update',
    key: adminKey,
    rowNum: rowNum,
    notes: JSON.stringify(doctorNotes),
    height: editedVitals.height,
    weight: editedVitals.weight
  };
  if (hasEditableAnswers) {
    payload.raw = JSON.stringify(answers);
    payload.summary = buildSummary();
  }
  fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
    .then(() => {
      const r = records[selectedIdx];
      if (r) {
        r.doctorNotes = payload.notes;
        r.height = payload.height;
        r.weight = payload.weight;
        if (hasEditableAnswers) { r.raw = payload.raw; r.summary = payload.summary; }
      }
      setSaveStatus('저장되었습니다 (' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ')', 'ok');
    })
    .catch(() => {
      setSaveStatus('저장 실패 - 네트워크를 확인해주세요.', 'err');
    });
}

// summary 텍스트("[카테고리] 질문: 답" / "   - 세부질문: 답")를 카테고리별 카드로 변환
function parseSummary(summary) {
  const cats = [];
  let cur = null;
  (summary || '').split('\n').forEach(line => {
    if (!line.trim()) return;
    const m = line.match(/^\[(.+?)\]\s(.*)$/);
    if (m) {
      if (!cur || cur.name !== m[1]) {
        cur = { name: m[1], rows: [] };
        cats.push(cur);
      }
      const [q, a] = splitQA(m[2]);
      cur.rows.push({ type: 'main', q, a });
    } else if (line.trim().startsWith('-') && cur) {
      const content = line.trim().replace(/^-\s*/, '');
      const [q, a] = splitQA(content);
      cur.rows.push({ type: 'sub', q, a });
    }
  });
  return cats;
}

function splitQA(text) {
  const idx = text.lastIndexOf(': ');
  if (idx === -1) return [text, ''];
  return [text.slice(0, idx), text.slice(idx + 2)];
}

// ===== 주증상(CC) / 진료메모 / 처방메모 =====
// 환자가 문진 마지막에 직접 적은 증상(answers.symptoms)이 있으면 그것을 CC 카드의 시작값으로 보여주고,
// 없으면 원장님이 처음부터 채울 수 있도록 빈 카드 1개로 시작합니다.
function seedDoctorNotesFromAnswers() {
  const syms = Array.isArray(answers.symptoms) ? answers.symptoms : [];
  const cc = syms.length
    ? syms.map(s => ({
        cc: s.symptom || '',
        os: s.since || '',
        symptom: s.how || '',
        worse: '',
        better: ''
      }))
    : [{ cc: '', os: '', symptom: '', worse: '', better: '' }];
  return { cc, memo: '', prescription: '', tendency: null, myunsaek: null, bulgeun: null, gita: [], anjin: {} };
}

// 예전 버전에서 저장된 doctorNotes(주증상/메모만 있던 시절)를 열어도 형색성정 항목이
// 비어있는 채로 안전하게 동작하도록 빠진 필드를 채워줍니다.
function normalizeDoctorNotes(n) {
  if (!n.cc || n.cc.length === 0) n.cc = [{ cc: '', os: '', symptom: '', worse: '', better: '' }];
  if (n.memo === undefined) n.memo = '';
  if (n.prescription === undefined) n.prescription = '';
  if (n.tendency === undefined) n.tendency = null;
  if (n.myunsaek === undefined) n.myunsaek = null;
  if (n.bulgeun === undefined) n.bulgeun = null;
  if (!Array.isArray(n.gita)) n.gita = [];
  if (!n.anjin || typeof n.anjin !== 'object') n.anjin = {};
  return n;
}

function ccRow(label, field, i, val, shaded) {
  return `<div class="cc-row${shaded ? ' shaded' : ''}"><span class="cc-label cc-${field}">${esc(label)}</span><textarea class="cc-input" oninput="updateCC(${i},'${field}',this.value)">${esc(val || '')}</textarea></div>`;
}

function renderChiefComplaints() {
  return doctorNotes.cc.map((c, i) => {
    let h = `<div class="cc-card">`;
    if (doctorNotes.cc.length > 1) h += `<div class="cc-remove" onclick="removeCC(${i})">삭제</div>`;
    h += ccRow('CC', 'cc', i, c.cc);
    h += ccRow('O/S', 'os', i, c.os, true);
    h += ccRow('증상', 'symptom', i, c.symptom);
    h += ccRow('악화요인', 'worse', i, c.worse, true);
    h += ccRow('완화요인', 'better', i, c.better);
    h += `</div>`;
    return h;
  }).join('');
}

// 텍스트 입력은 매 글자마다 다시 그리면 커서 위치가 튀므로, 값만 조용히 갱신하고 화면은 다시 그리지 않습니다.
function updateCC(i, field, val) { if (doctorNotes.cc[i]) doctorNotes.cc[i][field] = val; }

function addCC() {
  doctorNotes.cc.push({ cc: '', os: '', symptom: '', worse: '', better: '' });
  document.getElementById('cc-list').innerHTML = renderChiefComplaints();
}
function removeCC(i) {
  doctorNotes.cc.splice(i, 1);
  if (doctorNotes.cc.length === 0) doctorNotes.cc.push({ cc: '', os: '', symptom: '', worse: '', better: '' });
  document.getElementById('cc-list').innerHTML = renderChiefComplaints();
}

function toggleBig(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const isBig = el.classList.toggle('big');
  if (btn) btn.textContent = isBig ? '작게보기' : '크게보기';
}

// 0~6 dot-scale 값을 사람이 읽을 수 있는 텍스트로 변환 (AI에게 보낼 요약용)
function scaleLabel(idx, left, right) {
  if (idx === null || idx === undefined) return '미기록';
  const steps = ['매우 ' + left, left, '약간 ' + left, '중간', '약간 ' + right, right, '매우 ' + right];
  return steps[idx] !== undefined ? steps[idx] : String(idx);
}

// 현재 열려있는 환자의 문진 답변 / 형색성정 / 안진 / 주증상 / 진료메모를 AI에게 보낼
// 하나의 텍스트로 정리합니다. answers/selectedGender는 이미 이 환자 것으로 채워져 있습니다.
function buildPatientDataForAi(r) {
  // 원장님이 키/몸무게를 고친 경우, AI 추천에도 원본이 아니라 고친 값을 넘깁니다.
  const bmi = calcBMI(editedVitals.height, editedVitals.weight);
  const lines = [];
  lines.push(`이름: ${r.name || '-'} / 성별: ${r.gender || '-'} / 생년월일: ${r.birthDate || '-'}`);
  lines.push(`키/몸무게: ${editedVitals.height || '-'}cm / ${editedVitals.weight || '-'}kg (BMI ${bmi ? bmi.toFixed(1) : '-'})`);
  lines.push('');
  // 환자가 스스로 표현한 주소증을 맨 앞에 두어, 체크박스 응답보다 먼저·우선 고려하도록 합니다.
  lines.push('[환자가 직접 호소한 주증상 - 최우선으로 고려]');
  lines.push('· 주증상(CC, 원장이 정리)');
  const ccLines = doctorNotes.cc.filter(c => c.cc || c.symptom).map(c => `  - CC: ${c.cc || '-'} / O·S: ${c.os || '-'} / 증상: ${c.symptom || '-'} / 악화요인: ${c.worse || '-'} / 완화요인: ${c.better || '-'}`);
  lines.push(ccLines.length ? ccLines.join('\n') : '  (입력 없음)');
  if (r.symptoms) {
    lines.push('· 환자가 문진표에 직접 적은 원문');
    lines.push('  ' + r.symptoms.replace(/\n/g, '\n  '));
  }
  lines.push('');
  lines.push('[형색성정 - 원장 판단]');
  lines.push(`성향: ${scaleLabel(doctorNotes.tendency, '양적', '음적')}`);
  lines.push(`면색: ${scaleLabel(doctorNotes.myunsaek, '짙은편', '옅은편')}`);
  lines.push(`붉은기: ${doctorNotes.bulgeun || '미기록'}`);
  lines.push(`기타: ${doctorNotes.gita.length ? doctorNotes.gita.join(', ') : '해당없음'}`);
  const anjinFound = Object.keys(doctorNotes.anjin).filter(k => doctorNotes.anjin[k] > 0).map(k => `${k}(${doctorNotes.anjin[k]}/3)`);
  lines.push(`안진: ${anjinFound.length ? anjinFound.join(', ') : '기록없음'}`);
  lines.push('');
  lines.push('[문진 답변(체크박스)]');
  lines.push(buildSummary() || '(답변 없음)');
  lines.push('');
  lines.push('[진료메모]');
  lines.push(doctorNotes.memo || '(없음)');
  return lines.join('\n');
}

// "증상복사" 버튼 - 환자가 적은 내용 + 원장님이 표시한 형색성정·안진·CC·메모·처방메모까지
// 전부 한 번에 클립보드로 복사해서, EMR이나 다른 프로그램에 그대로 붙여넣을 수 있게 합니다.
function buildFullPatientSummary(r) {
  const lines = [buildPatientDataForAi(r)];
  lines.push('');
  lines.push('[처방메모]');
  lines.push(doctorNotes.prescription || '(없음)');
  return lines.join('\n');
}

function copyPatientSummary() {
  const r = records[selectedIdx];
  if (!r) return;
  const text = buildFullPatientSummary(r);
  const btn = document.getElementById('copy-summary-btn');
  const original = '📋 증상복사';
  const flash = (label) => {
    if (!btn) return;
    btn.textContent = label;
    setTimeout(() => { btn.textContent = original; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => flash('✓ 복사되었습니다')).catch(() => flash('복사 실패'));
  } else {
    flash('이 브라우저에서는 복사가 지원되지 않습니다');
  }
}

function runAiRecommend(rowNum) {
  const status = document.getElementById('ai-status');
  const resultEl = document.getElementById('ai-result');
  const btn = document.getElementById('ai-run-btn');
  if (btn) btn.disabled = true;
  if (status) { status.textContent = 'AI가 분석 중입니다... (몇 초 정도 걸릴 수 있어요)'; status.className = 'ai-status'; }
  if (resultEl) resultEl.innerHTML = '';

  const r = records[selectedIdx];
  const patientData = buildPatientDataForAi(r);
  const payload = { action: 'ai_recommend', key: adminKey, rowNum: rowNum, patientData: patientData };

  fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) })
    .then(res => res.json())
    .then(data => {
      if (btn) btn.disabled = false;
      if (!data || data.status !== 'ok') {
        const msg = (data && data.message) || 'AI 분석에 실패했습니다.';
        const rawHint = data && data.raw ? ('\n\n(AI가 실제로 보낸 내용 일부: ' + data.raw + ')') : '';
        if (status) { status.textContent = msg + rawHint; status.className = 'ai-status err'; }
        return;
      }
      lastAiResult = data.result;
      if (r) r.aiResult = JSON.stringify(data.result); // 서버(구글시트)에도 이미 저장됨 - 화면에서도 바로 반영
      if (status) status.textContent = '';
      if (resultEl) resultEl.innerHTML = renderAiResult(data.result);
    })
    .catch(() => {
      if (btn) btn.disabled = false;
      if (status) { status.textContent = '서버에 연결하지 못했습니다. 네트워크를 확인해주세요.'; status.className = 'ai-status err'; }
    });
}

function toggleAiReasons(btn) {
  const el = btn.nextElementSibling;
  const showing = el.style.display === 'block';
  el.style.display = showing ? 'none' : 'block';
  btn.textContent = showing ? '근거 보기' : '근거 숨기기';
}

function fillMemoFromCandidate(i) {
  if (!lastAiResult || !lastAiResult.candidates || !lastAiResult.candidates[i]) return;
  const c = lastAiResult.candidates[i];
  const matched = (c.matched || []).map(m => '- ' + m).join('\n');
  const missing = (c.missing || []).map(m => '- ' + m).join('\n');
  const text = `[AI 추천] ${c.name} (적합도 ${c.fit_percent}%)\n${c.note || ''}\n\n[일치하는 근거]\n${matched || '(없음)'}\n\n[확인이 더 필요한 부분]\n${missing || '(없음)'}`;
  doctorNotes.prescription = (doctorNotes.prescription ? doctorNotes.prescription + '\n\n---\n\n' : '') + text;
  const el = document.getElementById('memo-presc');
  if (el) el.value = doctorNotes.prescription;
}

function renderAiResult(result) {
  const candidates = result.candidates || [];
  const questions = result.additional_questions || [];
  let h = '<div class="ai-candidates">';
  candidates.forEach((c, i) => {
    const matched = (c.matched || []).map(m => `<div class="m">✓ ${esc(m)}</div>`).join('');
    const missing = (c.missing || []).map(m => `<div class="x">? ${esc(m)}</div>`).join('');
    h += `<div class="ai-candidate" onclick="fillMemoFromCandidate(${i})">
      <div class="ai-cand-top">
        <span class="ai-cand-rank">${i + 1}순위</span>
        <span class="ai-cand-name">${esc(c.name || '-')}</span>
        <span class="ai-cand-fit">${c.fit_percent != null ? c.fit_percent + '%' : '-'}</span>
      </div>
      <div class="ai-fit-bar"><div class="ai-fit-fill" style="width:${Math.max(0, Math.min(100, c.fit_percent || 0))}%"></div></div>
      <div class="ai-cand-note">${esc(c.note || '')}</div>
      <div class="ai-toggle" onclick="event.stopPropagation();toggleAiReasons(this)">근거 보기</div>
      <div class="ai-reasons" style="display:none">${matched}${missing}</div>
    </div>`;
  });
  h += '</div>';
  if (questions.length) {
    const qLines = questions.map(q => {
      // q가 문자열(예전 형식)이면 질문만, {question, reason} 객체면 이유도 함께 표시합니다.
      const questionText = typeof q === 'string' ? q : (q.question || '');
      const reasonText = typeof q === 'object' && q.reason ? q.reason : '';
      return `<li>${esc(questionText)}${reasonText ? `<div class="ai-q-reason">${esc(reasonText)}</div>` : ''}</li>`;
    }).join('');
    h += `<div class="ai-questions"><h4>환자에게 추가로 확인하면 좋은 질문</h4><ul>${qLines}</ul></div>`;
  }
  return h;
}

function renderSidePanel(rowNum) {
  let h = '';
  h += `<div class="save-bar top">
    <button onclick="saveAll(${rowNum})">💾 저장</button>
    <span class="save-status" id="save-status"></span>
  </div>`;
  h += `<div class="side-box cc">
    <div class="side-box-hdr"><h3>🗒️ 주증상</h3><button class="side-btn" onclick="addCC()">CC 추가</button></div>
    <div id="cc-list">${renderChiefComplaints()}</div>
  </div>`;
  h += `<div class="side-box memo">
    <div class="side-box-hdr"><h3>📝 진료메모</h3><button class="side-btn ghost" onclick="toggleBig('memo-note', this)">크게보기</button></div>
    <textarea class="memo-textarea" id="memo-note" oninput="doctorNotes.memo=this.value" placeholder="진료 중 원장님 의견을 적어주세요...">${esc(doctorNotes.memo || '')}</textarea>
  </div>`;
  h += `<div class="side-box ai">
    <div class="side-box-hdr"><h3>✨ AI 처방 추천</h3></div>
    <button class="ai-run-btn" id="ai-run-btn" onclick="runAiRecommend(${rowNum})">🤖 ${lastAiResult ? 'AI 처방 분석 다시 실행' : 'AI 처방 분석 실행'}</button>
    <div class="ai-note">문진·형색성정·안진 데이터를 바탕으로 후보를 제시합니다. 최종 처방은 원장님이 직접 판단해주세요.</div>
    <div class="ai-status" id="ai-status"></div>
    <div id="ai-result">${lastAiResult ? renderAiResult(lastAiResult) : ''}</div>
  </div>`;
  h += `<div class="side-box presc">
    <div class="side-box-hdr"><h3>💊 처방메모</h3><button class="side-btn ghost" onclick="toggleBig('memo-presc', this)">크게보기</button></div>
    <textarea class="memo-textarea" id="memo-presc" oninput="doctorNotes.prescription=this.value" placeholder="처방 내용을 적어주세요...">${esc(doctorNotes.prescription || '')}</textarea>
  </div>`;
  h += `<div class="save-bar">
    <button onclick="saveAll(${rowNum})">💾 저장</button>
    <span class="save-status"></span>
  </div>`;
  return h;
}

function renderDetail(i) {
  selectedIdx = i;
  renderList();
  const r = records[i];

  let editableAnswers = null;
  try { editableAnswers = r.raw ? JSON.parse(r.raw) : null; } catch (e) { editableAnswers = null; }

  // 환자를 새로 열었을 때만 원본 데이터로 초기화합니다. 같은 환자를 다시 그릴 때는
  // (문진 답변을 고치거나 주증상/메모를 입력한 내용이 지워지지 않도록) 그대로 유지합니다.
  if (editingRowNum !== r.rowNum) {
    answers = editableAnswers || {};
    selectedGender = r.gender || null;
    let parsedNotes = null;
    try { parsedNotes = r.doctorNotes ? JSON.parse(r.doctorNotes) : null; } catch (e) { parsedNotes = null; }
    doctorNotes = normalizeDoctorNotes(parsedNotes || seedDoctorNotesFromAnswers());
    // 이전 버전에서는 성향을 이 브라우저의 localStorage에만 저장했습니다.
    // 아직 구글시트에 저장된 성향 값이 없다면, 예전에 로컬에 남겨둔 값을 이어서 씁니다.
    if (doctorNotes.tendency === null) {
      const legacy = localStorage.getItem('tendency_' + r.rowNum);
      if (legacy !== null) doctorNotes.tendency = parseInt(legacy, 10);
    }
    try { lastAiResult = r.aiResult ? JSON.parse(r.aiResult) : null; } catch (e) { lastAiResult = null; }
    editedVitals = { height: r.height || '', weight: r.weight || '' };
    editingRowNum = r.rowNum;
  }
  hasEditableAnswers = !!editableAnswers;

  let h = '';
  h += `<div class="patient-card">
    <div class="name">${esc(r.name || '(이름없음)')}${r.gender ? `<span class="gender-tag ${genderClass(r.gender)}">${esc(r.gender)}</span>` : ''}</div>
    <div class="field">전화번호<b>${esc(r.phone || '-')}</b></div>
    <div class="field">생년월일<b>${esc(r.birthDate || '-')}</b></div>
    <div class="field">키 / 몸무게 <span class="vital-hint">(수정 가능)</span>
      <b class="vital-edit"><input type="number" step="0.1" class="vital-input" id="vital-height" value="${esc(editedVitals.height)}" oninput="updateVital('height', this.value)"> cm /
      <input type="number" step="0.1" class="vital-input" id="vital-weight" value="${esc(editedVitals.weight)}" oninput="updateVital('weight', this.value)"> kg</b>
    </div>
    <div class="field">제출일시<b>${r.submittedAt ? new Date(r.submittedAt).toLocaleString('ko-KR') : '-'}</b></div>
    <button class="copy-btn" id="copy-summary-btn" onclick="copyPatientSummary()">📋 증상복사</button>
  </div>`;

  h += `<div class="bmi-section">
    <h3>체형 분석 (BMI 자동 계산)</h3>
    <div id="bmi-body">${renderBMIBody()}</div>
  </div>`;

  h += renderHSS();

  if (r.symptoms) {
    h += `<div class="symptom-box"><h3>환자가 직접 적은 증상</h3><pre>${esc(r.symptoms)}</pre></div>`;
  }

  if (editableAnswers) {
    // 실제 라디오버튼/체크박스로 문진 답변을 그려서, 원장님이 진료 중 환자와 함께 보면서
    // 잘못 표현된 답변이 있으면 바로 클릭해서 고칠 수 있게 합니다. (저장 버튼은 오른쪽 패널에 하나로 통합)
    const cats = buildEditableCats();
    h += `<div class="cat-grid">`;
    cats.forEach(cat => {
      h += `<div class="cat-card"><div class="cat-hdr">${esc(cat.name)}</div><div class="cat-body">${cat.rows.join('')}</div></div>`;
    });
    h += `</div>`;
  } else {
    // raw 데이터가 없거나 손상된 옛 기록은 예전처럼 읽기 전용 텍스트로 보여줍니다.
    const cats = moveCatToFront(parseSummary(r.summary), '감정');
    h += `<div class="cat-grid">`;
    cats.forEach(cat => {
      h += `<div class="cat-card"><div class="cat-hdr">${esc(cat.name)}</div><div class="cat-body">`;
      cat.rows.forEach(row => {
        if (row.type === 'main') {
          h += `<div class="qa-row"><span class="q">${esc(row.q)}</span><br><span class="a">${esc(row.a)}</span></div>`;
        } else {
          h += `<div class="qa-sub"><b>${esc(row.q)}</b>: ${esc(row.a)}</div>`;
        }
      });
      h += `</div></div>`;
    });
    h += `</div>`;
  }

  h += `<div class="raw-toggle" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display==='block' ? 'none' : 'block'">원본 데이터 보기(백업용)</div>`;
  h += `<div class="raw-box">${esc(r.raw || '')}</div>`;

  const sideH = renderSidePanel(r.rowNum);

  document.getElementById('detail').innerHTML =
    `<div class="two-col"><div class="col-main">${h}</div><div class="col-side">${sideH}</div></div>`;
}
</script>
</body>
</html>
