}

// 키/몸무게 입력칸이 바뀔 때마다 호출 - BMI만 다시 그리고(#bmi-body),
// 값 자체는 저장 버튼을 눌러야 구글시트에 반영됩니다.
function updateVital(field, val) {
  editedVitals[field] = val;
  const el = document.getElementById('bmi-body');
  if (el) el.innerHTML = renderBMIBody();
  const gt = document.getElementById('goal-target');
  if (gt) gt.textContent = goalTargetText();
}

// 다이어트 탭 환자카드에 "감량목표 -> 목표 체중" 을 계산해 보여줍니다.
// goal(감량목표)은 목표 체중이 아니라 '빼고 싶은 무게'이므로 목표 체중 = 몸무게 - goal.
function goalTargetText() {
  const w = parseFloat(editedVitals.weight);
  const g = parseFloat(editedVitals.goal);
  if (w > 0 && g > 0 && g < w) {
    const t = (w - g).toFixed(1).replace(/\.0$/, '');
    return ` → 목표 체중 약 ${t}kg`;
  }
  return '';
}

function renderBMIBody() {
  const bmi = calcBMI(editedVitals.height, editedVitals.weight);
  return `<div class="bmi-bar">${renderBMI(bmi, selectedGender, isChildPatient)}</div>` +
    (bmi ? `<div class="bmi-note">BMI ${bmi.toFixed(1)}</div>` : `<div class="bmi-note">키/몸무게 정보가 없어 계산할 수 없습니다.</div>`);
}

// ===== 소아 성장 평가 (herbal.html에서 계산해 raw JSON(answers._growth)에 담아 보낸 값을 그대로 표시) =====
// 자동 계산 결과이며 참고용 통계 추정치입니다 (growth-data.js 참고).
function renderGrowthSection(g) {
  let body = '';
  if (g.ageYears !== null && g.ageYears !== undefined) body += `만 나이: <b>${g.ageYears}세</b> (${g.ageMonths}개월)<br>`;
  if (g.heightPercentile !== undefined) body += `키 백분위수: <b>${g.heightPercentile}</b> — ${esc(g.heightDesc || '')}<br>`;
  if (g.weightPercentile !== undefined) body += `몸무게 백분위수: <b>${g.weightPercentile}</b> — ${esc(g.weightDesc || '')}<br>`;
  if (g.fatherHeight || g.motherHeight) {
    body += `부모님 키: <b>${g.fatherHeight ? '아버지 ' + g.fatherHeight + 'cm' : ''}${g.fatherHeight && g.motherHeight ? ' / ' : ''}${g.motherHeight ? '어머니 ' + g.motherHeight + 'cm' : ''}</b><br>`;
  }
  if (g.predictedHeight) body += `예상 성인키(참고): <b>${g.predictedHeight.mid}cm</b> (${g.predictedHeight.low}~${g.predictedHeight.high}cm)<br>`;
  return `<div class="bmi-section" style="border-left-color:var(--c-blue);">
    <h3 style="color:var(--c-blue);">소아 성장 평가 (참고용)</h3>
    <div style="font-size:12.5px;color:var(--ink-700);line-height:1.9;">${body}</div>
    <div class="bmi-note">2017 소아청소년 성장도표 기준 통계적 추정치이며, 진단이 아닙니다.</div>
  </div>`;
}

// ===== 형색성정: 성향/면색/붉은기/기타/안진 (모두 원장님이 진료 중 직접 판단해 표시, 자동 아님) =====
// 주증상/메모와 함께 doctorNotes에 담겨 "저장" 버튼을 누르면 구글시트에 저장됩니다.
const ANJIN_ITEMS = [
  '상완 이두근 압통', '상완 삼두근 압통',
  '심하 좁은부위 압통', '심하 넓은부위 압통',
  '우 협하 압통', '좌 협하 압통',
  '늑골들림', '복직근 경결 압통',
  '우 제하 압통', '좌 제하 압통',
  '복피 찰과 발적', '비복근 압통',
  '경골상 함요 부종',
  '장요근 압통', '능형근·기립근 압통'
];

function refreshHSS() {
  const el = document.getElementById('hss-body');
  if (el) el.innerHTML = renderHSSBody();
}

function setDotField(field, idx) {
  doctorNotes[field] = doctorNotes[field] === idx ? null : idx;
  refreshHSS();
}
function setTagField(field, val) {
  doctorNotes[field] = doctorNotes[field] === val ? null : val;
  refreshHSS();
}
function toggleGita(val) {
  const i = doctorNotes.gita.indexOf(val);
  if (i > -1) doctorNotes.gita.splice(i, 1);
  else doctorNotes.gita.push(val);
  refreshHSS();
}
function setAnjinStar(name, star) {
  doctorNotes.anjin[name] = doctorNotes.anjin[name] === star ? 0 : star;
  refreshHSS();
}

function renderDotScale(field, leftLabel, rightLabel) {
  const cur = doctorNotes[field];
  let h = `<span class="end-label">${leftLabel}</span>`;
  for (let i = 0; i < 7; i++) {
    const act = cur === i ? ' active' : '';
    h += `<div class="dot-btn${act}" onclick="setDotField('${field}',${i})"></div>`;
  }
  h += `<span class="end-label right">${rightLabel}</span>`;
  return h;
}

function renderHSSBody() {
  let h = '<div class="hss-left">';
  h += `<div class="hss-sub">· 성향</div><div class="dot-scale">${renderDotScale('tendency', '양적', '음적')}</div>`;
  h += `<div class="hss-sub">· 면색</div><div class="dot-scale">${renderDotScale('myunsaek', '짙은편', '옅은편')}</div>`;

  h += `<div class="hss-sub">· 붉은기</div><div class="tag-group">`;
  ['약간그렇다', '그렇다', '매우그렇다'].forEach(t => {
    const act = doctorNotes.bulgeun === t ? ' active' : '';
    h += `<div class="tag-btn${act}" onclick="setTagField('bulgeun','${t}')">${t}</div>`;
  });
  h += `</div>`;

  h += `<div class="hss-sub">· 기타(선택)</div><div class="tag-group">`;
  ['미간주름', '입술건조', '안구황색침착'].forEach(t => {
    const act = doctorNotes.gita.includes(t) ? ' active' : '';
    h += `<div class="tag-btn${act}" onclick="toggleGita('${t}')">${t}</div>`;
  });
  h += `</div></div>`; // hss-left

  h += `<div class="hss-right"><div class="anjin-title">· 안진</div><div class="anjin-grid">`;
  ANJIN_ITEMS.forEach(name => {
    const stars = doctorNotes.anjin[name] || 0;
    h += `<div class="anjin-item"><span class="aj-name">${esc(name)}</span><div class="star-group">`;
    for (let s = 1; s <= 3; s++) {
      const on = s <= stars ? ' on' : '';
      h += `<span class="star-btn${on}" onclick="setAnjinStar('${escJsAttr(name)}',${s})">&#9733;</span>`;
    }
    h += `</div></div>`;
  });
  h += `</div></div>`; // hss-right
  return h;
}

function renderHSS() {
  return `<div class="hss-section">
    <h3>형색성정</h3>
    <div class="sub">자동 계산이 아니라, 원장님이 진료 중 직접 판단해 표시하는 항목입니다.</div>
    <div class="hss-two" id="hss-body">${renderHSSBody()}</div>
  </div>`;
}

// ===== 문진 답변 수정 (환자가 잘못 표현한 부분을 원장이 직접 고칠 수 있도록) =====
// questions.js 의 Q / visibleQ() / buildSummary() 를 그대로 사용하고, 전역 answers/selectedGender 를
// 현재 열어본 환자의 답변으로 채운 뒤 실제 라디오버튼/체크박스로 그려줍니다.

// 옵션 문자열을 onclick="..." 안의 JS 문자열로 안전하게 넣기 위한 이스케이프 (index.html의 esc()와 동일)
function escJsAttr(s) { return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function isEditSelected(qId, opt, type) {
  if (type === 'single') return answers[qId] === opt;
  return (answers[qId] || []).includes(opt);
}

// docs/index.html 의 pick()과 동일한 선택/토글 로직
function editPick(qId, val, type) {
  val = val.replace(/\\'/g, "'");
  const isNA = val === '해당없음' || val === '해당 없음';
  if (type === 'single') {
    if (answers[qId] === val) delete answers[qId];
    else answers[qId] = val;
  } else {
    if (!answers[qId]) answers[qId] = [];
    const i = answers[qId].indexOf(val);
    if (i > -1) {
      answers[qId].splice(i, 1);
    } else if (isNA) {
      answers[qId] = [val];
    } else {
      answers[qId] = answers[qId].filter(v => v !== '해당없음' && v !== '해당 없음');
      answers[qId].push(val);
    }
    if (answers[qId].length === 0) delete answers[qId];
  }
  renderDetail(selectedIdx);
}

function editToggleEmo(itemId) {
  answers[itemId] = !answers[itemId];
  if (!answers[itemId]) delete answers[itemId];
  renderDetail(selectedIdx);
}

// 과거력/복용약물처럼 자유 텍스트로 답하는 문항(type:"text") 수정용. 키 입력마다 다시 그리면
// 커서 위치가 튀므로, 다른 필드로 넘어갈 때(onchange)만 저장하고 다시 그립니다.
function editPickText(qId, val) {
  if (val && val.trim()) answers[qId] = val.trim();
  else delete answers[qId];
  renderDetail(selectedIdx);
}

// ===== 다이어트 문진 답변 수정 (한약 문진의 editPick/editPickText/renderQuestionRow와 같은 방식이지만,
// DIET_Q에는 sub/emotion 타입이 없어 더 단순합니다. 전역 dietAnswers를 사용합니다.) =====
function isDietEditSelected(qId, opt, type) {
  if (type === 'single') return dietAnswers[qId] === opt;
  return (dietAnswers[qId] || []).includes(opt);
}

function editDietPick(qId, val, type) {
  val = val.replace(/\\'/g, "'");
  if (type === 'single') {
    if (dietAnswers[qId] === val) delete dietAnswers[qId];
    else dietAnswers[qId] = val;
  } else {
    if (!dietAnswers[qId]) dietAnswers[qId] = [];
    const i = dietAnswers[qId].indexOf(val);
    if (i > -1) dietAnswers[qId].splice(i, 1);
    else dietAnswers[qId].push(val);
    if (dietAnswers[qId].length === 0) delete dietAnswers[qId];
  }
  renderDietDetail(selectedDietIdx);
}

function editDietPickText(qId, val) {
  if (val && val.trim()) dietAnswers[qId] = val.trim();
  else delete dietAnswers[qId];
  renderDietDetail(selectedDietIdx);
}

function renderDietQuestionRow(q) {
  if (q.type === 'text') {
    const val = dietAnswers[q.id] || '';
    return `<div class="qa-row"><span class="q">${esc(q.title)}</span></div><div class="edit-opts">` +
      `<textarea style="width:100%;min-height:60px;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13.5px;box-sizing:border-box;" ` +
      `onchange="editDietPickText('${q.id}', this.value)">${esc(val)}</textarea></div>`;
  }
  const inputType = q.type === 'multi' ? 'checkbox' : 'radio';
  let h = `<div class="qa-row"><span class="q">${esc(q.title)}</span></div><div class="edit-opts">`;
  q.opts.forEach(o => {
    const checked = isDietEditSelected(q.id, o, q.type);
    h += `<label class="edit-opt"><input type="${inputType}" name="edit_diet_${q.id}" ${checked ? 'checked' : ''} onclick="editDietPick('${q.id}','${escJsAttr(o)}','${q.type}')"> ${esc(o)}</label>`;
  });
  h += `</div>`;
  return h;
}

function buildDietEditableCats() {
  const cats = [];
  let cur = null;
  visibleDietQ(dietAnswers).forEach(q => {
    if (!cur || cur.name !== q.cat) { cur = { name: q.cat, rows: [] }; cats.push(cur); }
    cur.rows.push(renderDietQuestionRow(q));
  });
  return moveCatToFront(cats, '체크리스트');
}

function renderSubQuestionRow(sq) {
  const inputType = sq.type === 'multi' ? 'checkbox' : 'radio';
  let h = '';
  if (sq.title) h += `<div class="qa-sub-title">${esc(sq.title)}</div>`;
  h += `<div class="edit-opts">`;
  sq.opts.forEach(o => {
    const checked = isEditSelected(sq.id, o, sq.type);
    h += `<label class="edit-opt"><input type="${inputType}" name="edit_${sq.id}" ${checked ? 'checked' : ''} onclick="editPick('${sq.id}','${escJsAttr(o)}','${sq.type}')"> ${esc(o)}</label>`;
  });
  h += `</div>`;
  return h;
}

function renderQuestionRow(q) {
  if (q.type === 'text') {
    const val = answers[q.id] || '';
    return `<div class="qa-row"><span class="q">${esc(q.title)}</span></div><div class="edit-opts">` +
      `<textarea style="width:100%;min-height:60px;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13.5px;box-sizing:border-box;" ` +
      `onchange="editPickText('${q.id}', this.value)">${esc(val)}</textarea></div>`;
  }
  if (q.type === 'emotion') {
    let h = `<div class="qa-row"><span class="q">${esc(q.title)}</span></div><div class="edit-opts">`;
    q.groups.forEach(g => g.items.forEach(it => {
      const checked = answers[it.id] === true;
      h += `<label class="edit-chk"><input type="checkbox" ${checked ? 'checked' : ''} onclick="editToggleEmo('${it.id}')"> ${esc(it.text)}</label>`;
    }));
    h += `</div>`;
    return h;
  }

  const inputType = q.type === 'multi' ? 'checkbox' : 'radio';
  let h = `<div class="qa-row"><span class="q">${esc(q.title)}</span></div><div class="edit-opts">`;
  q.opts.forEach(o => {
    const checked = isEditSelected(q.id, o, q.type);
    h += `<label class="edit-opt"><input type="${inputType}" name="edit_${q.id}" ${checked ? 'checked' : ''} onclick="editPick('${q.id}','${escJsAttr(o)}','${q.type}')"> ${esc(o)}</label>`;
  });
  h += `</div>`;

  if (q.sub) {
    const val = answers[q.id];
    const chosen = Array.isArray(val) ? val : (val !== undefined ? [val] : []);
    chosen.forEach(v => {
      if (q.sub[v]) {
        h += `<div class="qa-sub-block">`;
        q.sub[v].forEach(sq => { h += renderSubQuestionRow(sq); });
        h += `</div>`;
      }
    });
  }
  return h;
}

// 카테고리 카드 중 하나를 맨 앞으로 옮깁니다 (예: 감정을 형색성정 바로 다음, 문진 카드 중 맨 앞에 배치).
function moveCatToFront(cats, name) {
  const idx = cats.findIndex(c => c.name === name);
  if (idx > 0) cats.unshift(cats.splice(idx, 1)[0]);
  return cats;
}

function buildEditableCats() {
  const cats = [];
  let cur = null;
  visibleQ().forEach(q => {
    if (q.type === 'symptom_entry') return;
    if (!cur || cur.name !== q.cat) { cur = { name: q.cat, rows: [] }; cats.push(cur); }
    cur.rows.push(renderQuestionRow(q));
  });
  return moveCatToFront(cats, '감정');
}

// 문진 답변 수정(raw/summary)과 형색성정·주증상·메모(notes)를 한 번에 저장합니다.
// 구글시트에서는 서로 다른 칸이라 따로 저장돼야 하지만, 원장님 입장에서는 버튼 하나면 충분합니다.
// 저장 버튼은 사이드 패널 위/아래 두 곳에 있어, 상태 메시지도 둘 다(.save-status) 갱신합니다.
function setSaveStatus(text, cls) {
  document.querySelectorAll('.save-status').forEach(el => { el.textContent = text; el.className = 'save-status' + (cls ? ' ' + cls : ''); });
}

function saveAll(rowNum) {
  setSaveStatus('저장 중...', '');
  const payload = {
    action: 'update',
    key: adminKey,
    rowNum: rowNum,
    notes: JSON.stringify(doctorNotes),
    height: editedVitals.height,
    weight: editedVitals.weight
  };
  if (hasEditableAnswers) {
    payload.raw = JSON.stringify(answers);
    payload.summary = buildSummary();
  }
  fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
    .then(() => {
      const r = records[selectedIdx];
      if (r) {
        r.doctorNotes = payload.notes;
        r.height = payload.height;
        r.weight = payload.weight;
        if (hasEditableAnswers) { r.raw = payload.raw; r.summary = payload.summary; }
      }
      setSaveStatus('저장되었습니다 (' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ')', 'ok');
    })
    .catch(() => {
      setSaveStatus('저장 실패 - 네트워크를 확인해주세요.', 'err');
    });
}

// summary 텍스트("[카테고리] 질문: 답" / "   - 세부질문: 답")를 카테고리별 카드로 변환
function parseSummary(summary) {
  const cats = [];
  let cur = null;
  (summary || '').split('\n').forEach(line => {
    if (!line.trim()) return;
    const m = line.match(/^\[(.+?)\]\s(.*)$/);
    if (m) {
      if (!cur || cur.name !== m[1]) {
        cur = { name: m[1], rows: [] };
        cats.push(cur);
      }
      const [q, a] = splitQA(m[2]);
      cur.rows.push({ type: 'main', q, a });
    } else if (line.trim().startsWith('-') && cur) {
      const content = line.trim().replace(/^-\s*/, '');
      const [q, a] = splitQA(content);
      cur.rows.push({ type: 'sub', q, a });
    }
  });
  return cats;
}

function splitQA(text) {
  const idx = text.lastIndexOf(': ');
  if (idx === -1) return [text, ''];
  return [text.slice(0, idx), text.slice(idx + 2)];
}

// ===== 주증상(CC) / 진료메모 / 처방메모 =====
// 환자가 문진 마지막에 직접 적은 증상(answers.symptoms)이 있으면 그것을 CC 카드의 시작값으로 보여주고,
// 없으면 원장님이 처음부터 채울 수 있도록 빈 카드 1개로 시작합니다.
function seedDoctorNotesFromAnswers() {
  const syms = Array.isArray(answers.symptoms) ? answers.symptoms : [];
  const cc = syms.length
    ? syms.map(s => ({
        cc: s.symptom || '',
        os: s.since || '',
        symptom: s.how || '',
        worse: '',
        better: ''
      }))
    : [{ cc: '', os: '', symptom: '', worse: '', better: '' }];
  return { cc, memo: '', prescription: '', tendency: null, myunsaek: null, bulgeun: null, gita: [], anjin: {} };
}

// 예전 버전에서 저장된 doctorNotes(주증상/메모만 있던 시절)를 열어도 형색성정 항목이
// 비어있는 채로 안전하게 동작하도록 빠진 필드를 채워줍니다.
function normalizeDoctorNotes(n) {
  if (!n.cc || n.cc.length === 0) n.cc = [{ cc: '', os: '', symptom: '', worse: '', better: '' }];
  if (n.memo === undefined) n.memo = '';
  if (n.prescription === undefined) n.prescription = '';
  if (n.tendency === undefined) n.tendency = null;
  if (n.myunsaek === undefined) n.myunsaek = null;
  if (n.bulgeun === undefined) n.bulgeun = null;
  if (!Array.isArray(n.gita)) n.gita = [];
  if (!n.anjin || typeof n.anjin !== 'object') n.anjin = {};
  return n;
}

function ccRow(label, field, i, val, shaded) {
  return `<div class="cc-row${shaded ? ' shaded' : ''}"><span class="cc-label cc-${field}">${esc(label)}</span><textarea class="cc-input" oninput="updateCC(${i},'${field}',this.value)">${esc(val || '')}</textarea></div>`;
}

function renderChiefComplaints() {
  return doctorNotes.cc.map((c, i) => {
    let h = `<div class="cc-card">`;
    if (doctorNotes.cc.length > 1) h += `<div class="cc-remove" onclick="removeCC(${i})">삭제</div>`;
    h += ccRow('CC', 'cc', i, c.cc);
    h += ccRow('O/S', 'os', i, c.os, true);
    h += ccRow('증상', 'symptom', i, c.symptom);
    h += ccRow('악화요인', 'worse', i, c.worse, true);
    h += ccRow('완화요인', 'better', i, c.better);
    h += `</div>`;
    return h;
  }).join('');
}

// 텍스트 입력은 매 글자마다 다시 그리면 커서 위치가 튀므로, 값만 조용히 갱신하고 화면은 다시 그리지 않습니다.
function updateCC(i, field, val) { if (doctorNotes.cc[i]) doctorNotes.cc[i][field] = val; }

function addCC() {
  doctorNotes.cc.push({ cc: '', os: '', symptom: '', worse: '', better: '' });
  document.getElementById('cc-list').innerHTML = renderChiefComplaints();
}
function removeCC(i) {
  doctorNotes.cc.splice(i, 1);
  if (doctorNotes.cc.length === 0) doctorNotes.cc.push({ cc: '', os: '', symptom: '', worse: '', better: '' });
  document.getElementById('cc-list').innerHTML = renderChiefComplaints();
}

function toggleBig(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const isBig = el.classList.toggle('big');
  if (btn) btn.textContent = isBig ? '작게보기' : '크게보기';
}

// 0~6 dot-scale 값을 사람이 읽을 수 있는 텍스트로 변환 (AI에게 보낼 요약용)
function scaleLabel(idx, left, right) {
  if (idx === null || idx === undefined) return '미기록';
  const steps = ['매우 ' + left, left, '약간 ' + left, '중간', '약간 ' + right, right, '매우 ' + right];
  return steps[idx] !== undefined ? steps[idx] : String(idx);
}

// 현재 열려있는 환자의 문진 답변 / 형색성정 / 안진 / 주증상 / 진료메모를 AI에게 보낼
// 하나의 텍스트로 정리합니다. answers/selectedGender는 이미 이 환자 것으로 채워져 있습니다.
function buildPatientDataForAi(r) {
  // 원장님이 키/몸무게를 고친 경우, AI 추천에도 원본이 아니라 고친 값을 넘깁니다.
  const bmi = calcBMI(editedVitals.height, editedVitals.weight);
  const lines = [];
  lines.push(`이름: ${r.name || '-'} / 성별: ${r.gender || '-'} / 생년월일: ${r.birthDate || '-'}`);
  lines.push(`키/몸무게: ${editedVitals.height || '-'}cm / ${editedVitals.weight || '-'}kg (BMI ${bmi ? bmi.toFixed(1) : '-'})`);
  if (answers._growth) {
    lines.push('');
    lines.push('[소아 성장평가 - 참고용 통계 추정치]');
    lines.push(buildGrowthSummaryText(answers._growth).split('\n').map(l => l.replace(/^\[.+?\]\s*/, '')).join('\n'));
  }
  lines.push('');
  // 환자가 스스로 표현한 주소증을 맨 앞에 두어, 체크박스 응답보다 먼저·우선 고려하도록 합니다.
  lines.push('[환자가 직접 호소한 주증상 - 최우선으로 고려]');
  lines.push('· 주증상(CC, 원장이 정리)');
  const ccLines = doctorNotes.cc.filter(c => c.cc || c.symptom).map(c => `  - CC: ${c.cc || '-'} / O·S: ${c.os || '-'} / 증상: ${c.symptom || '-'} / 악화요인: ${c.worse || '-'} / 완화요인: ${c.better || '-'}`);
  lines.push(ccLines.length ? ccLines.join('\n') : '  (입력 없음)');
  if (r.symptoms) {
    lines.push('· 환자가 문진표에 직접 적은 원문');
    lines.push('  ' + r.symptoms.replace(/\n/g, '\n  '));
  }
  lines.push('');
  lines.push('[형색성정 - 원장 판단]');
  lines.push(`성향: ${scaleLabel(doctorNotes.tendency, '양적', '음적')}`);
  lines.push(`면색: ${scaleLabel(doctorNotes.myunsaek, '짙은편', '옅은편')}`);
  lines.push(`붉은기: ${doctorNotes.bulgeun || '미기록'}`);
  lines.push(`기타: ${doctorNotes.gita.length ? doctorNotes.gita.join(', ') : '해당없음'}`);
  const anjinFound = Object.keys(doctorNotes.anjin).filter(k => doctorNotes.anjin[k] > 0).map(k => `${k}(${doctorNotes.anjin[k]}/3)`);
  lines.push(`안진: ${anjinFound.length ? anjinFound.join(', ') : '기록없음'}`);
  lines.push('');
  lines.push('[문진 답변(체크박스)]');
  lines.push(buildSummary() || '(답변 없음)');
  lines.push('');
  lines.push('[진료메모]');
  lines.push(doctorNotes.memo || '(없음)');
  return lines.join('\n');
}

// "증상복사" 버튼 - 환자가 적은 내용 + 원장님이 표시한 형색성정·안진·CC·메모·처방메모까지
// 전부 한 번에 클립보드로 복사해서, EMR이나 다른 프로그램에 그대로 붙여넣을 수 있게 합니다.
function buildFullPatientSummary(r) {
  const lines = [buildPatientDataForAi(r)];
  lines.push('');
  lines.push('[처방메모]');
  lines.push(doctorNotes.prescription || '(없음)');
  return lines.join('\n');
}

function copyPatientSummary() {
  const r = records[selectedIdx];
  if (!r) return;
  const text = buildFullPatientSummary(r);
  const btn = document.getElementById('copy-summary-btn');
  const original = '📋 증상복사';
  const flash = (label) => {
    if (!btn) return;
    btn.textContent = label;
    setTimeout(() => { btn.textContent = original; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => flash('✓ 복사되었습니다')).catch(() => flash('복사 실패'));
  } else {
    flash('이 브라우저에서는 복사가 지원되지 않습니다');
  }
}

function runAiRecommend(rowNum) {
  const status = document.getElementById('ai-status');
  const resultEl = document.getElementById('ai-result');
  const btn = document.getElementById('ai-run-btn');
  if (btn) btn.disabled = true;
  if (status) { status.textContent = 'AI가 분석 중입니다... (몇 초 정도 걸릴 수 있어요)'; status.className = 'ai-status'; }
  if (resultEl) resultEl.innerHTML = '';

  const r = records[selectedIdx];
  const patientData = buildPatientDataForAi(r);
  const payload = { action: 'ai_recommend', key: adminKey, rowNum: rowNum, patientData: patientData };

  fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) })
    .then(res => res.json())
    .then(data => {
      if (btn) btn.disabled = false;
      if (!data || data.status !== 'ok') {
        const msg = (data && data.message) || 'AI 분석에 실패했습니다.';
        const rawHint = data && data.raw ? ('\n\n(AI가 실제로 보낸 내용 일부: ' + data.raw + ')') : '';
        if (status) { status.textContent = msg + rawHint; status.className = 'ai-status err'; }
        return;
      }
      lastAiResult = data.result;
      if (r) r.aiResult = JSON.stringify(data.result); // 서버(구글시트)에도 이미 저장됨 - 화면에서도 바로 반영
      if (status) status.textContent = '';
      if (resultEl) resultEl.innerHTML = renderAiResult(data.result);
    })
    .catch(() => {
      if (btn) btn.disabled = false;
      if (status) { status.textContent = '서버에 연결하지 못했습니다. 네트워크를 확인해주세요.'; status.className = 'ai-status err'; }
    });
}

function toggleAiReasons(btn) {
  const el = btn.nextElementSibling;
  const showing = el.style.display === 'block';
  el.style.display = showing ? 'none' : 'block';
  btn.textContent = showing ? '근거 보기' : '근거 숨기기';
}

function fillMemoFromCandidate(i) {
  if (!lastAiResult || !lastAiResult.candidates || !lastAiResult.candidates[i]) return;
  const c = lastAiResult.candidates[i];
  const matched = (c.matched || []).map(m => '- ' + m).join('\n');
  const missing = (c.missing || []).map(m => '- ' + m).join('\n');
  const text = `[AI 추천] ${c.name} (적합도 ${c.fit_percent}%)\n${c.note || ''}\n\n[일치하는 근거]\n${matched || '(없음)'}\n\n[확인이 더 필요한 부분]\n${missing || '(없음)'}`;
  doctorNotes.prescription = (doctorNotes.prescription ? doctorNotes.prescription + '\n\n---\n\n' : '') + text;
  const el = document.getElementById('memo-presc');
  if (el) el.value = doctorNotes.prescription;
}

function renderAiResult(result) {
  const candidates = result.candidates || [];
  const questions = result.additional_questions || [];
  let h = '<div class="ai-candidates">';
  candidates.forEach((c, i) => {
    const matched = (c.matched || []).map(m => `<div class="m">✓ ${esc(m)}</div>`).join('');
    const missing = (c.missing || []).map(m => `<div class="x">? ${esc(m)}</div>`).join('');
    h += `<div class="ai-candidate" onclick="fillMemoFromCandidate(${i})">
      <div class="ai-cand-top">
        <span class="ai-cand-rank">${i + 1}순위</span>
        <span class="ai-cand-name">${esc(c.name || '-')}</span>
        <span class="ai-cand-fit">${c.fit_percent != null ? c.fit_percent + '%' : '-'}</span>
      </div>
      <div class="ai-fit-bar"><div class="ai-fit-fill" style="width:${Math.max(0, Math.min(100, c.fit_percent || 0))}%"></div></div>
      <div class="ai-cand-note">${esc(c.note || '')}</div>
      <div class="ai-toggle" onclick="event.stopPropagation();toggleAiReasons(this)">근거 보기</div>
      <div class="ai-reasons" style="display:none">${matched}${missing}</div>
    </div>`;
  });
  h += '</div>';
  if (questions.length) {
    const qLines = questions.map(q => {
      // q가 문자열(예전 형식)이면 질문만, {question, reason} 객체면 이유도 함께 표시합니다.
      const questionText = typeof q === 'string' ? q : (q.question || '');
      const reasonText = typeof q === 'object' && q.reason ? q.reason : '';
      return `<li>${esc(questionText)}${reasonText ? `<div class="ai-q-reason">${esc(reasonText)}</div>` : ''}</li>`;
    }).join('');
    h += `<div class="ai-questions"><h4>환자에게 추가로 확인하면 좋은 질문</h4><ul>${qLines}</ul></div>`;
  }
  return h;
}

function renderSidePanel(rowNum) {
  let h = '';
  h += `<div class="save-bar top">
    <button onclick="saveAll(${rowNum})">💾 저장</button>
    <span class="save-status" id="save-status"></span>
  </div>`;
  h += `<div class="side-box cc">
    <div class="side-box-hdr"><h3>🗒️ 주증상</h3><button class="side-btn" onclick="addCC()">CC 추가</button></div>
    <div id="cc-list">${renderChiefComplaints()}</div>
  </div>`;
  h += `<div class="side-box memo">
    <div class="side-box-hdr"><h3>📝 진료메모</h3><button class="side-btn ghost" onclick="toggleBig('memo-note', this)">크게보기</button></div>
    <textarea class="memo-textarea" id="memo-note" oninput="doctorNotes.memo=this.value" placeholder="진료 중 원장님 의견을 적어주세요...">${esc(doctorNotes.memo || '')}</textarea>
  </div>`;
  h += `<div class="side-box ai">
    <div class="side-box-hdr"><h3>✨ AI 처방 추천</h3></div>
    <button class="ai-run-btn" id="ai-run-btn" onclick="runAiRecommend(${rowNum})">🤖 ${lastAiResult ? 'AI 처방 분석 다시 실행' : 'AI 처방 분석 실행'}</button>
    <div class="ai-note">문진·형색성정·안진 데이터를 바탕으로 후보를 제시합니다. 최종 처방은 원장님이 직접 판단해주세요.</div>
    <div class="ai-status" id="ai-status"></div>
    <div id="ai-result">${lastAiResult ? renderAiResult(lastAiResult) : ''}</div>
  </div>`;
  h += `<div class="side-box presc">
    <div class="side-box-hdr"><h3>💊 처방메모</h3><button class="side-btn ghost" onclick="toggleBig('memo-presc', this)">크게보기</button></div>
    <textarea class="memo-textarea" id="memo-presc" oninput="doctorNotes.prescription=this.value" placeholder="처방 내용을 적어주세요...">${esc(doctorNotes.prescription || '')}</textarea>
  </div>`;
  h += `<div class="save-bar">
    <button onclick="saveAll(${rowNum})">💾 저장</button>
    <span class="save-status"></span>
  </div>`;
  return h;
}

function renderDetail(i) {
  selectedIdx = i;
  renderList();
  const r = records[i];

  let editableAnswers = null;
  try { editableAnswers = r.raw ? JSON.parse(r.raw) : null; } catch (e) { editableAnswers = null; }

  // 환자를 새로 열었을 때만 원본 데이터로 초기화합니다. 같은 환자를 다시 그릴 때는
  // (문진 답변을 고치거나 주증상/메모를 입력한 내용이 지워지지 않도록) 그대로 유지합니다.
  if (editingRowNum !== r.rowNum) {
    answers = editableAnswers || {};
    selectedGender = r.gender || null;
    isChildPatient = isChildAge(r.birthDate);
    childTier = isChildPatient ? childAgeTier(r.birthDate) : null;
    let parsedNotes = null;
    try { parsedNotes = r.doctorNotes ? JSON.parse(r.doctorNotes) : null; } catch (e) { parsedNotes = null; }
    doctorNotes = normalizeDoctorNotes(parsedNotes || seedDoctorNotesFromAnswers());
    // 이전 버전에서는 성향을 이 브라우저의 localStorage에만 저장했습니다.
    // 아직 구글시트에 저장된 성향 값이 없다면, 예전에 로컬에 남겨둔 값을 이어서 씁니다.
    if (doctorNotes.tendency === null) {
      const legacy = localStorage.getItem('tendency_' + r.rowNum);
      if (legacy !== null) doctorNotes.tendency = parseInt(legacy, 10);
    }
    try { lastAiResult = r.aiResult ? JSON.parse(r.aiResult) : null; } catch (e) { lastAiResult = null; }
    editedVitals = { height: r.height || '', weight: r.weight || '' };
    editingRowNum = r.rowNum;
  }
  hasEditableAnswers = !!editableAnswers;

  let h = '';
  h += `<div class="patient-card">
    <div class="name">${esc(r.name || '(이름없음)')}${r.gender ? `<span class="gender-tag ${genderClass(r.gender)}">${esc(r.gender)}</span>` : ''}${childTagHtml(r)}</div>
    <div class="field">전화번호<b>${esc(r.phone || '-')}</b></div>
    <div class="field">생년월일<b>${esc(r.birthDate || '-')}</b></div>
    <div class="field">키 / 몸무게 <span class="vital-hint">(수정 가능)</span>
      <b class="vital-edit"><input type="number" step="0.1" class="vital-input" id="vital-height" value="${esc(editedVitals.height)}" oninput="updateVital('height', this.value)"> cm /
      <input type="number" step="0.1" class="vital-input" id="vital-weight" value="${esc(editedVitals.weight)}" oninput="updateVital('weight', this.value)"> kg</b>
    </div>
    <div class="field">제출일시<b>${r.submittedAt ? new Date(r.submittedAt).toLocaleString('ko-KR') : '-'}</b></div>
    <button class="copy-btn" id="copy-summary-btn" onclick="copyPatientSummary()">📋 증상복사</button>
  </div>`;

  h += `<div class="bmi-section">
    <h3>체형 분석 (BMI 자동 계산)</h3>
    <div id="bmi-body">${renderBMIBody()}</div>
  </div>`;

  const growthInfo = editableAnswers && editableAnswers._growth;
  if (growthInfo) h += renderGrowthSection(growthInfo);

  h += renderHSS();

  if (r.symptoms) {
    h += `<div class="symptom-box"><h3>환자가 직접 적은 증상</h3><pre>${esc(r.symptoms)}</pre></div>`;
  }

  if (editableAnswers) {
    // 실제 라디오버튼/체크박스로 문진 답변을 그려서, 원장님이 진료 중 환자와 함께 보면서
    // 잘못 표현된 답변이 있으면 바로 클릭해서 고칠 수 있게 합니다. (저장 버튼은 오른쪽 패널에 하나로 통합)
    const cats = buildEditableCats();
    h += `<div class="cat-grid">`;
    cats.forEach(cat => {
      h += `<div class="cat-card"><div class="cat-hdr">${esc(cat.name)}</div><div class="cat-body">${cat.rows.join('')}</div></div>`;
    });
    h += `</div>`;
  } else {
    // raw 데이터가 없거나 손상된 옛 기록은 예전처럼 읽기 전용 텍스트로 보여줍니다.
    const cats = moveCatToFront(parseSummary(r.summary), '감정');
    h += `<div class="cat-grid">`;
    cats.forEach(cat => {
      h += `<div class="cat-card"><div class="cat-hdr">${esc(cat.name)}</div><div class="cat-body">`;
      cat.rows.forEach(row => {
        if (row.type === 'main') {
          h += `<div class="qa-row"><span class="q">${esc(row.q)}</span><br><span class="a">${esc(row.a)}</span></div>`;
        } else {
          h += `<div class="qa-sub"><b>${esc(row.q)}</b>: ${esc(row.a)}</div>`;
        }
      });
      h += `</div></div>`;
    });
    h += `</div>`;
  }

  h += `<div class="raw-toggle" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display==='block' ? 'none' : 'block'">원본 데이터 보기(백업용)</div>`;
  h += `<div class="raw-box">${esc(r.raw || '')}</div>`;

  const sideH = renderSidePanel(r.rowNum);

  document.getElementById('detail').innerHTML =
    `<div class="two-col"><div class="col-main">${h}</div><div class="col-side">${sideH}</div></div>`;
  enterMobileDetail();
}

// ===== 체성분(체중/골격근량/체지방량) 측정 기록 + 변화 추이 =====
// 원장님이 진료 중 실측한 값을 기록하는 곳. 별도 시트 칸을 만들지 않고, 이미 있는
// "원장 메모(JSON)" 칸(dietNotes) 안에 measurements 배열로 함께 저장합니다.
// (구글 Apps Script를 다시 배포하지 않아도 되도록 한 설계입니다.)
// 그래프는 같은 환자(전화번호 우선, 없으면 이름+생년월일)의 모든 다이어트 문진 행에
// 쌓인 측정값을 한데 모아 시간순으로 보여줍니다 - 재내원 시 변화가 한눈에 보입니다.
function bcNum_(v) { const n = parseFloat(v); return isFinite(n) ? n : null; }

function collectDietPatientMeasurements(r) {
  const phone = (r.phone || '').trim();
  const rows = dietRecords.filter(function (x) {
    if (phone) return (x.phone || '').trim() === phone;
    return (x.name || '') === (r.name || '') && (x.birthDate || '') === (r.birthDate || '');
  });
  const out = [];
  rows.forEach(function (x) {
    let notes = null;
    if (x.rowNum === editingDietRowNum) {
      notes = dietNotes; // 방금 화면에서 추가/삭제한 (아직 저장 전) 값도 반영
    } else {
      try { notes = x.doctorNotes ? JSON.parse(x.doctorNotes) : null; } catch (e) { notes = null; }
    }
    const ms = (notes && Array.isArray(notes.measurements)) ? notes.measurements : [];
    ms.forEach(function (m) {
      if (!m || !m.d) return;
      out.push({ d: String(m.d), w: bcNum_(m.w), smm: bcNum_(m.smm), bf: bcNum_(m.bf), memo: m.memo || '', src: m.src === 'self' ? 'self' : 'clinic' });
    });
  });
  out.sort(function (a, b) { return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });
  return out;
}

// InBody "체성분 변화" 표처럼, 지표(체중/골격근량/체지방량)별로 가로 띠를 하나씩 두고
// 그 안에 값 라벨 + 꺾은선 + 점을 그립니다. x축은 측정 순서대로 균등 간격(맨 아래 측정일 행).
// 각 띠는 그 지표 자신의 최소~최대로 스케일해서, 변화 폭이 작아도 잘 보이게 합니다.
function renderBodyTrendChart(rows) {
  const defs = [
    { key: 'w', label: '체중', color: '#2563eb', soft: '#dbeafe' },
    { key: 'smm', label: '골격근량', color: '#0d9488', soft: '#d5f0eb' },
    { key: 'bf', label: '체지방량', color: '#ea580c', soft: '#ffe6d2' }
  ];
  const pts = rows.filter(function (r) { return r.w != null || r.smm != null || r.bf != null; });
  if (pts.length < 1) {
    return '<div class="bc-empty">측정 기록을 추가하면 누적그래프가 표시됩니다.</div>';
  }
  const N = pts.length;
  const labelW = 58;
  const rowH = 44;
  const dateH = 26;
  const padR = 14, padT = 3;
  // 측정 수치는 라벨 칸 바로 옆(x0)부터 시작해 왼쪽으로 바싹 붙입니다. 측정이 적으면
  // 칸 간격(colStep)에 상한을 둬서 오른쪽으로 과하게 벌어지지 않게 합니다(InBody 스캔지 스타일).
  const W = Math.max(440, 60 * N + labelW + padR + 36);
  const H = padT + rowH * defs.length + dateH;
  const plotL = labelW + 8;
  const plotR = W - padR;
  const plotW = plotR - plotL;
  const x0 = plotL + 18;
  const colStep = N <= 1 ? 0 : Math.min((plotW - 30) / (N - 1), 116);
  const xAt = function (i) { return x0 + i * colStep; };

  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="xMinYMid meet" style="display:block;min-width:' + Math.min(W, 560) + 'px;max-width:' + W + 'px;">';

  defs.forEach(function (d, di) {
    const bandY = padT + di * rowH;
    const withV = [];
    pts.forEach(function (p, i) { if (p[d.key] != null) withV.push({ i: i, v: p[d.key], src: p.src }); });
    svg += '<rect x="0" y="' + bandY + '" width="' + W + '" height="' + rowH + '" fill="' + d.soft + '" opacity="0.55"/>';
    svg += '<rect x="0" y="' + bandY + '" width="' + labelW + '" height="' + rowH + '" fill="' + d.color + '"/>';
    svg += '<text x="' + (labelW / 2) + '" y="' + (bandY + rowH / 2 - 3) + '" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">' + d.label + '</text>';
    svg += '<text x="' + (labelW / 2) + '" y="' + (bandY + rowH / 2 + 10) + '" text-anchor="middle" font-size="8" fill="#fff" opacity="0.85">kg</text>';
    svg += '<line x1="0" y1="' + (bandY + rowH) + '" x2="' + W + '" y2="' + (bandY + rowH) + '" stroke="#cfd4e0" stroke-width="1"/>';
    if (withV.length === 0) {
      svg += '<text x="' + (plotL + 24) + '" y="' + (bandY + rowH / 2 + 3) + '" text-anchor="middle" font-size="9" fill="#9aa1b2">기록 없음</text>';
      return;
    }
    let vmin = Math.min.apply(null, withV.map(function (o) { return o.v; }));
    let vmax = Math.max.apply(null, withV.map(function (o) { return o.v; }));
    if (vmin === vmax) { vmin -= 1; vmax += 1; }
    const innerTop = bandY + 20, innerBot = bandY + rowH - 8;
    const yAt = function (v) { return innerBot - (v - vmin) / (vmax - vmin) * (innerBot - innerTop); };
    if (withV.length >= 2) {
      svg += '<polyline points="' + withV.map(function (o) { return xAt(o.i).toFixed(1) + ',' + yAt(o.v).toFixed(1); }).join(' ') +
        '" fill="none" stroke="' + d.color + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    withV.forEach(function (o) {
      const x = xAt(o.i), y = yAt(o.v);
      const isSelf = o.src === 'self';
      const dash = isSelf ? ' stroke-dasharray="2.4 1.6"' : '';
      svg += '<text x="' + x.toFixed(1) + '" y="' + (bandY + 12) + '" text-anchor="middle" font-size="10" font-weight="700" fill="' + d.color + '">' + o.v.toFixed(1) + '</text>';
      svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (isSelf ? '2.9' : '3.4') + '" fill="#fff" stroke="' + d.color + '" stroke-width="2"' + dash + '/>';
    });
  });

  const dRowY = padT + rowH * defs.length;
  svg += '<rect x="0" y="' + dRowY + '" width="' + W + '" height="' + dateH + '" fill="#eef0f6"/>';
  svg += '<rect x="0" y="' + dRowY + '" width="' + labelW + '" height="' + dateH + '" fill="#3a4256"/>';
  svg += '<text x="' + (labelW / 2) + '" y="' + (dRowY + dateH / 2 + 3.5) + '" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">측정일</text>';
  const dStep = N > 9 ? 2 : 1;
  pts.forEach(function (p, i) {
    if (i % dStep !== 0 && i !== N - 1) return;
    const parts = String(p.d).split('-');
    const lab = parts.length === 3 ? (parts[0].slice(2) + '.' + parts[1] + '.' + parts[2]) : p.d;
    svg += '<text x="' + xAt(i).toFixed(1) + '" y="' + (dRowY + dateH / 2 + 3.5) + '" text-anchor="middle" font-size="8.5" fill="#4a5064">' + lab + '</text>';
  });

  svg += '</svg>';

  const legend = defs.map(function (d) {
    const withV = pts.filter(function (p) { return p[d.key] != null; });
    let delta = '';
    if (withV.length >= 2) {
      const diff = withV[withV.length - 1][d.key] - withV[0][d.key];
      const sign = diff > 0 ? '+' : '';
      // 골격근량은 늘어야 좋고(초록), 체중·체지방량은 줄어야 좋다(줄면 초록, 늘면 빨강)
      const good = (d.key === 'smm') ? (diff >= 0) : (diff <= 0);
      delta = '<span class="bc-delta ' + (good ? 'up-good' : 'down-bad') + '">' + sign + diff.toFixed(1) + 'kg</span>';
    }
    const last = withV.length ? withV[withV.length - 1][d.key].toFixed(1) + 'kg' : '-';
    return '<span class="bc-leg"><i style="background:' + d.color + '"></i>' + d.label + ' <b>' + last + '</b> ' + delta + '</span>';
  }).join('');
  const hasSelf = pts.some(function (p) { return p.src === 'self'; });
  const caption = hasSelf ? '<div class="bc-caption">점선 테두리 점 = 환자 자가측정(전화 비대면)</div>' : '';
  return '<div class="bc-gridtitle">신체변화 누적그래프</div>' +
    '<div class="bc-chart bc-grid">' + svg + '</div><div class="bc-legend">' + legend + '</div>' + caption;
}

function renderBodyCompSection(r) {
  const rows = collectDietPatientMeasurements(r);
  const own = Array.isArray(dietNotes.measurements) ? dietNotes.measurements : [];
  const otherCount = rows.length - own.length;
  const _t = new Date();
  const today = _t.getFullYear() + '-' + String(_t.getMonth() + 1).padStart(2, '0') + '-' + String(_t.getDate()).padStart(2, '0');
  const curW = (editedVitals.weight !== undefined && editedVitals.weight !== null && editedVitals.weight !== '') ? esc(editedVitals.weight) : '';

  let table;
  if (own.length) {
    table = '<table class="bc-table"><thead><tr><th>날짜</th><th>출처</th><th>체중</th><th>골격근량</th><th>체지방량</th><th>메모</th><th></th></tr></thead><tbody>' +
      own.map(function (m, i) {
        const cell = function (x) { return (x !== undefined && x !== null && x !== '') ? esc(x) + 'kg' : '-'; };
        const srcTag = m.src === 'self'
          ? '<span class="src-tag self">자가</span>'
          : '<span class="src-tag clinic">내원</span>';
        return '<tr><td>' + esc(m.d || '') + '</td><td>' + srcTag + '</td><td>' + cell(m.w) + '</td><td>' + cell(m.smm) + '</td><td>' + cell(m.bf) +
          '</td><td class="bc-memo">' + esc(m.memo || '') + '</td>' +
          '<td><button class="bc-del" title="삭제" onclick="deleteMeasurement(' + r.rowNum + ', ' + i + ')">&#10005;</button></td></tr>';
      }).join('') +
      '</tbody></table>';
  } else {
    table = '<div class="bc-empty">아직 이 환자에 대해 기록한 체성분 측정값이 없습니다.</div>';
  }

  const otherNote = otherCount > 0 ? '<div class="bc-note">이전 방문에서 기록한 ' + otherCount + '건도 위 그래프에 함께 표시됩니다.</div>' : '';
  // 기본 출처: 진료 방식이 '전화 비대면'이면 자가측정, 아니면 내원 실측
  const defSrc = dietNotes.visitType === 'phone' ? 'self' : 'clinic';

  return '<div class="bmi-section bc-section">' +
    '<h3>체성분 측정 · 변화 추이</h3>' +
    '<div class="sub">진료 중 실측한 체중·골격근량·체지방량(kg)을 기록하면, 다시 내원했을 때 변화가 그래프로 표시됩니다. 저장 버튼을 따로 누르지 않아도 추가·삭제 시 자동 저장됩니다.</div>' +
    renderBodyTrendChart(rows) +
    otherNote +
    table +
    '<div class="bc-form">' +
      '<label>날짜<input type="date" id="m-date" value="' + today + '"></label>' +
      '<label>출처<select class="bc-src" id="m-src">' +
        '<option value="clinic"' + (defSrc === 'clinic' ? ' selected' : '') + '>내원 실측</option>' +
        '<option value="self"' + (defSrc === 'self' ? ' selected' : '') + '>자가측정(전화)</option>' +
      '</select></label>' +
      '<label>체중(kg)<input type="number" step="0.1" id="m-weight" value="' + curW + '" placeholder="예: 62.5"></label>' +
      '<label>골격근량(kg)<input type="number" step="0.1" id="m-smm" placeholder="예: 24.1"></label>' +
      '<label>체지방량(kg)<input type="number" step="0.1" id="m-bf" placeholder="예: 18.3"></label>' +
      '<label class="bc-memo-in">메모<input type="text" id="m-memo" placeholder="선택 입력 (예: 3주차)"></label>' +
      '<button class="bc-add" onclick="addMeasurement(' + r.rowNum + ')">&#43; 측정 기록 추가</button>' +
    '</div>' +
  '</div>';
}

function addMeasurement(rowNum) {
  const d = (document.getElementById('m-date').value || '').trim();
  const w = document.getElementById('m-weight').value.trim();
  const smm = document.getElementById('m-smm').value.trim();
  const bf = document.getElementById('m-bf').value.trim();
  const memo = document.getElementById('m-memo').value.trim();
  if (!d) { alert('측정 날짜를 선택해주세요.'); return; }
  if (w === '' && smm === '' && bf === '') { alert('체중·골격근량·체지방량 중 하나 이상 입력해주세요.'); return; }
  const srcEl = document.getElementById('m-src');
  const m = { d: d, src: (srcEl && srcEl.value === 'self') ? 'self' : 'clinic' };
  if (w !== '') m.w = Number(w);
  if (smm !== '') m.smm = Number(smm);
  if (bf !== '') m.bf = Number(bf);
  if (memo) m.memo = memo;
  if (!Array.isArray(dietNotes.measurements)) dietNotes.measurements = [];
  dietNotes.measurements.push(m);
  dietNotes.measurements.sort(function (a, b) { return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });
  saveDietAll(rowNum);
  renderDietDetail(selectedDietIdx);
}

function deleteMeasurement(rowNum, idx) {
  if (!Array.isArray(dietNotes.measurements) || !dietNotes.measurements[idx]) return;
  if (!confirm('이 측정 기록을 삭제할까요?')) return;
  dietNotes.measurements.splice(idx, 1);
  saveDietAll(rowNum);
  renderDietDetail(selectedDietIdx);
}

// ===== 진료 방식(직접 내원 / 전화 비대면) =====
// 원장님이 상세 화면에서 표시. measurements와 마찬가지로 별도 시트 칸 없이 dietNotes 안에
// visitType('clinic' | 'phone')으로 저장되어, 목록에도 배지로 표시됩니다.
function dietVisitTypeOf(r) {
  if (r.rowNum === editingDietRowNum && dietNotes) return dietNotes.visitType || '';
  try { const n = r.doctorNotes ? JSON.parse(r.doctorNotes) : null; return (n && n.visitType) || ''; } catch (e) { return ''; }
}

function visitTagHtml(vt) {
  if (vt === 'clinic') return '<span class="visit-tag clinic">내원</span>';
  if (vt === 'phone') return '<span class="visit-tag phone">비대면</span>';
  return '';
}

function renderVisitTypeField(rowNum) {
  const vt = dietNotes.visitType || '';
  return '<div class="field">진료 방식' +
    '<b class="vt-toggle">' +
      '<button type="button" class="vt-btn' + (vt === 'clinic' ? ' on' : '') + '" onclick="setVisitType(\'clinic\',' + rowNum + ')">직접 내원</button>' +
      '<button type="button" class="vt-btn phone' + (vt === 'phone' ? ' on' : '') + '" onclick="setVisitType(\'phone\',' + rowNum + ')">전화 비대면</button>' +
    '</b></div>';
}

function setVisitType(v, rowNum) {
  dietNotes.visitType = (dietNotes.visitType === v) ? '' : v;
  saveDietAll(rowNum);
  renderDietDetail(selectedDietIdx);
}

// ===== 다이어트문진 상세 (한약 문진과 질문/항목이 완전히 달라 별도 렌더링) =====
// r.raw(문진 당시 저장된 답변 JSON)가 있으면 한약 문진처럼 라디오/체크박스로 그려서
// 체크 안 된 항목도 같이 보여주고 원장님이 바로 고칠 수 있게 합니다. raw가 없거나 손상된
// 옛 기록은 예전처럼 summary 텍스트(답한 것만 표시)로 읽기 전용 보여줍니다.
function renderDietDetail(i) {
  selectedDietIdx = i;
  renderList();
  const r = dietRecords[i];

  let editableDietAnswers = null;
  try { editableDietAnswers = r.raw ? JSON.parse(r.raw) : null; } catch (e) { editableDietAnswers = null; }

  // 환자를 새로 열었을 때만 원본 값으로 초기화합니다 (상담메모 작성 중 내용이 지워지지 않도록).
  if (editingDietRowNum !== r.rowNum) {
    dietAnswers = editableDietAnswers || {};
    let parsedNotes = null;
    try { parsedNotes = r.doctorNotes ? JSON.parse(r.doctorNotes) : null; } catch (e) { parsedNotes = null; }
    dietNotes = (parsedNotes && typeof parsedNotes === 'object') ? Object.assign({ memo: '' }, parsedNotes) : { memo: '' };
    if (!Array.isArray(dietNotes.measurements)) dietNotes.measurements = [];
    editedVitals = { height: r.height || '', weight: r.weight || '', goal: r.goal || '' };
    selectedGender = r.gender || null;
    isChildPatient = isChildAge(r.birthDate);
    editingDietRowNum = r.rowNum;
  }
  hasEditableDietAnswers = !!editableDietAnswers;

  let h = '';
  h += `<div class="patient-card">
    <div class="name">${esc(r.name || '(이름없음)')}${r.gender ? `<span class="gender-tag ${genderClass(r.gender)}">${esc(r.gender)}</span>` : ''}${childTagHtml(r)}</div>
    <div class="field">전화번호<b>${esc(r.phone || '-')}</b></div>
    <div class="field">생년월일<b>${esc(r.birthDate || '-')}</b></div>
    <div class="field">희망개월수<b>${esc(r.plan || '-')}</b></div>
    ${renderVisitTypeField(r.rowNum)}
    <div class="field">주소<b>${esc(r.address || '-')}</b></div>
    <div class="field">키 / 몸무게 / 감량목표 <span class="vital-hint">(수정 가능 · 감량목표 = 빼고 싶은 무게)</span>
      <b class="vital-edit"><input type="number" step="0.1" class="vital-input" value="${esc(editedVitals.height)}" oninput="updateVital('height', this.value)"> cm /
      <input type="number" step="0.1" class="vital-input" value="${esc(editedVitals.weight)}" oninput="updateVital('weight', this.value)"> kg / 감량
      <input type="number" step="0.1" class="vital-input" value="${esc(editedVitals.goal)}" oninput="updateVital('goal', this.value)"> kg<span class="vital-hint" id="goal-target">${goalTargetText()}</span></b>
    </div>
    <div class="field">제출일시<b>${r.submittedAt ? new Date(r.submittedAt).toLocaleString('ko-KR') : '-'}</b></div>
  </div>`;

  h += `<div class="bmi-section">
    <h3>체형 분석 (BMI 자동 계산)</h3>
    <div id="bmi-body">${renderBMIBody()}</div>
  </div>`;

  h += renderBodyCompSection(r);

  if (hasEditableDietAnswers) {
    const cats = buildDietEditableCats();
    h += `<div class="cat-grid">`;
    cats.forEach(cat => {
      h += `<div class="cat-card"><div class="cat-hdr">${esc(cat.name)}</div><div class="cat-body">${cat.rows.join('')}</div></div>`;
    });
    h += `</div>`;
  } else {
    const cats = moveCatToFront(parseSummary(r.summary), '체크리스트');
    h += `<div class="cat-grid">`;
    cats.forEach(cat => {
      h += `<div class="cat-card"><div class="cat-hdr">${esc(cat.name)}</div><div class="cat-body">`;
      cat.rows.forEach(row => {
        h += `<div class="qa-row"><span class="q">${esc(row.q)}</span><br><span class="a">${esc(row.a)}</span></div>`;
      });
      h += `</div></div>`;
    });
    h += `</div>`;
  }

  h += `<div class="raw-toggle" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display==='block' ? 'none' : 'block'">원본 데이터 보기(백업용)</div>`;
  h += `<div class="raw-box">${esc(r.raw || '')}</div>`;

  let side = '';
  side += `<div class="save-bar top">
    <button onclick="saveDietAll(${r.rowNum})">💾 저장</button>
    <span class="save-status" id="save-status"></span>
  </div>`;
  side += `<div class="side-box memo">
    <div class="side-box-hdr"><h3>📝 상담메모</h3><button class="side-btn ghost" onclick="toggleBig('diet-memo-note', this)">크게보기</button></div>
    <textarea class="memo-textarea" id="diet-memo-note" oninput="dietNotes.memo=this.value" placeholder="상담 중 원장님 의견을 적어주세요...">${esc(dietNotes.memo || '')}</textarea>
  </div>`;
  side += `<div class="save-bar">
    <button onclick="saveDietAll(${r.rowNum})">💾 저장</button>
    <span class="save-status"></span>
  </div>`;

  document.getElementById('detail').innerHTML =
    `<div class="two-col"><div class="col-main">${h}</div><div class="col-side">${side}</div></div>`;
  enterMobileDetail();
}

function saveDietAll(rowNum) {
  setSaveStatus('저장 중...', '');
  const payload = {
    action: 'update',
    key: adminKey,
    rowNum: rowNum,
    formType: 'diet',
    notes: JSON.stringify(dietNotes),
    height: editedVitals.height,
    weight: editedVitals.weight,
    goal: editedVitals.goal
  };
  if (hasEditableDietAnswers) {
    payload.raw = JSON.stringify(dietAnswers);
    payload.summary = buildDietSummary(dietAnswers);
  }
  fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
    .then(() => {
      const r = dietRecords[selectedDietIdx];
      if (r) {
        r.doctorNotes = payload.notes;
        r.height = payload.height;
        r.weight = payload.weight;
        if (hasEditableDietAnswers) { r.raw = payload.raw; r.summary = payload.summary; }
        r.goal = payload.goal;
      }
      setSaveStatus('저장되었습니다 (' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ')', 'ok');
    })
    .catch(() => {
      setSaveStatus('저장 실패 - 네트워크를 확인해주세요.', 'err');
    });
}
</script>
</body>
</html>
